let audioCtx = null;
function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  switch (type) {
    case 'shoot': osc.type = 'square'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.08); gain.gain.setValueAtTime(0.03, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08); osc.start(now); osc.stop(now + 0.08); break;
    case 'kill': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1); break;
    case 'bosskill': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.4); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4); osc.start(now); osc.stop(now + 0.4); break;
    case 'levelup': [0, 0.08, 0.16].forEach((delay, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'sine'; o.frequency.setValueAtTime(523 * (i + 1), now + delay); g.gain.setValueAtTime(0.08, now + delay); g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.15); o.start(now + delay); o.stop(now + delay + 0.15); }); return;
    case 'death': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.6); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6); osc.start(now); osc.stop(now + 0.6); break;
    case 'dash': osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.15); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.start(now); osc.stop(now + 0.15); break;
    case 'elite': osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.linearRampToValueAtTime(880, now + 0.3); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.start(now); osc.stop(now + 0.3); break;
  }
}

// ---- Background Music (Mario-style chiptune) ----
let bgMusicActive = false;
let bgMusicNodes = null;

const MELODY_NOTES = [
  // Melody: E4 E4 . E4 . C4 E4 G4 . G3 . C4
  329.63, 329.63, 0, 329.63, 0, 261.63, 329.63, 392.00,
  0, 196.00, 0, 261.63,
  // A4 A4 . A4 . G4 E4 C4 . G3 . E4
  440.00, 440.00, 0, 440.00, 0, 392.00, 329.63, 261.63,
  0, 196.00, 0, 329.63,
  // E4 G4 A4 B4 A4 G4 E4 C4 D4 E4 . .
  329.63, 392.00, 440.00, 493.88, 440.00, 392.00, 329.63, 261.63,
  293.66, 329.63, 0, 0,
  // G4 A4 G4 E4 C4 D4 C4 . . . .
  392.00, 440.00, 392.00, 329.63, 261.63, 293.66, 261.63, 0,
  0, 0, 0, 0,
];
const MELODY_STEP = 0.14; // seconds per note

function scheduleMelody(startTime) {
  const gain = audioCtx.createGain();
  gain.gain.value = 0.05;
  gain.connect(audioCtx.destination);
  
  let scheduled = [];
  for (let i = 0; i < MELODY_NOTES.length; i++) {
    const freq = MELODY_NOTES[i];
    const t = startTime + i * MELODY_STEP;
    if (freq > 0) {
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = freq;
      const noteGain = audioCtx.createGain();
      noteGain.gain.setValueAtTime(0.06, t);
      noteGain.gain.setValueAtTime(0, t + MELODY_STEP * 0.85);
      osc.connect(noteGain); noteGain.connect(gain);
      osc.start(t); osc.stop(t + MELODY_STEP);
      scheduled.push(osc);
    }
  }
  return scheduled;
}

function scheduleBass(startTime) {
  const gain = audioCtx.createGain();
  gain.gain.value = 0.04;
  gain.connect(audioCtx.destination);
  
  // Bass pattern: quarter notes on beat
  const bassNotes = [130.81, 130.81, 164.81, 164.81, 146.83, 146.83, 130.81, 130.81]; // C3, C3, E3, E3, D3, D3, C3, C3
  const bassStep = MELODY_STEP * 6; // every 6 melody steps = 1 bass note
  let scheduled = [];
  for (let i = 0; i < 8; i++) {
    const t = startTime + i * bassStep;
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = bassNotes[i];
    const noteGain = audioCtx.createGain();
    noteGain.gain.setValueAtTime(0.04, t);
    noteGain.gain.exponentialRampToValueAtTime(0.001, t + bassStep * 0.8);
    osc.connect(noteGain); noteGain.connect(gain);
    osc.start(t); osc.stop(t + bassStep);
    scheduled.push(osc);
  }
  return scheduled;
}

let bgMusicInterval = null;
function startBgMusic() {
  if (!audioCtx || bgMusicActive) return;
  bgMusicActive = true;
  document.getElementById('btnMusic').textContent = '🔊';

  const totalLen = MELODY_NOTES.length * MELODY_STEP;
  
  function playLoop() {
    if (!bgMusicActive) return;
    const now = audioCtx.currentTime;
    scheduleMelody(now);
    scheduleBass(now);
  }
  
  playLoop();
  bgMusicInterval = setInterval(playLoop, totalLen * 1000);
}

function stopBgMusic() {
  bgMusicActive = false;
  document.getElementById('btnMusic').textContent = '🔇';
  if (bgMusicInterval) { clearInterval(bgMusicInterval); bgMusicInterval = null; }
}

function toggleMusic() {
  if (bgMusicActive) stopBgMusic();
  else startBgMusic();
}
function update() {
  if (game.upgradeActive) return; // Freeze game during upgrade selection
  if (game.paused) return;        // Freeze game when paused

  if (game.state !== 'playing') {
    if (game.state === 'dying') {
      game.deathAnim++; updateParticles(); game.shake *= 0.9;
      if (game.deathAnim > 50) { game.state = 'gameover'; showGameOver(); }
    }
    return;
  }

  game.time += 1 / 60; game.frame++;

  // Phase transition alerts
  if (game.time > 80 && game.currentPhase === 1) {
    game.currentPhase = 2; game.phaseAlert = 120;
    showToast('进入中期 · 喘息时刻', '怪物增长放缓，抓紧强化武器！');
  }
  if (game.time > 200 && game.currentPhase === 2) {
    game.currentPhase = 3; game.phaseAlert = 120;
    showToast('进入后期 · 极限挑战', '怪物加速变强，全靠走位！');
  }

  // Crown rewards — after 4 minutes, every 5s
  if (game.time >= 240 && game.time >= game.crownNextAt) {
    game.crowns++;
    game.crownNextAt += 5;
    showFloatText(game.player.x, game.player.y - 30, '👑 +1', '#ffd700', 1.6);
  }

  // ---- Player Movement ----
  const p = game.player;
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (joy.active && (Math.abs(joy.dx) > 5 || Math.abs(joy.dy) > 5)) {
    const jDist = Math.hypot(joy.dx, joy.dy); mx = joy.dx / jDist; my = joy.dy / jDist;
  }
  const mLen = Math.hypot(mx, my);

  // ---- Dash movement (overrides normal movement) ----
  if (p.dashFrames > 0) {
    p.x += p.dashDirX * DASH_SPEED;
    p.y += p.dashDirY * DASH_SPEED;
    p.x = clamp(p.x, CFG.PLAYER_RADIUS, CFG.MAP_W - CFG.PLAYER_RADIUS);
    p.y = clamp(p.y, CFG.PLAYER_RADIUS, CFG.MAP_H - CFG.PLAYER_RADIUS);
    pushOutOfObstacles(p, CFG.PLAYER_RADIUS);
    // Afterimage
    p.afterimages.push({ x: p.x, y: p.y, life: 1 });
    if (p.afterimages.length > 8) p.afterimages.shift();
    p.dashFrames--;
  } else if (mLen > 0) {
    mx /= mLen; my /= mLen;
    p.x += mx * CFG.PLAYER_SPEED; p.y += my * CFG.PLAYER_SPEED;
    p.x = clamp(p.x, CFG.PLAYER_RADIUS, CFG.MAP_W - CFG.PLAYER_RADIUS);
    p.y = clamp(p.y, CFG.PLAYER_RADIUS, CFG.MAP_H - CFG.PLAYER_RADIUS);
    pushOutOfObstacles(p, CFG.PLAYER_RADIUS);
    if (game.frame % 3 === 0) { p.trail.push({ x: p.x, y: p.y, life: 1 }); if (p.trail.length > 12) p.trail.shift(); }
  }
  // Decrement dash timers
  if (p.dashCooldown > 0) p.dashCooldown--;
  if (p.invulnFrames > 0) p.invulnFrames--;
  // Fade afterimages
  for (const ai of p.afterimages) ai.life -= 0.12;
  p.afterimages = p.afterimages.filter(ai => ai.life > 0);

  for (const t of p.trail) t.life -= 0.08;
  p.trail = p.trail.filter(t => t.life > 0);

  // ---- Camera ----
  const targetCamX = clamp(p.x - W / 2, 0, CFG.MAP_W - W);
  const targetCamY = clamp(p.y - H / 2, 0, CFG.MAP_H - H);
  game.camera.x += (targetCamX - game.camera.x) * 0.12;
  game.camera.y += (targetCamY - game.camera.y) * 0.12;

  // ---- Weapon Timers ----
  const dt = 1000 / 60;
  for (const w of p.weapons) {
    w.timer -= dt;
    if (w.timer <= 0) {
      if (w.type === 'projectile') { fireProjectile(w); playSound('shoot'); }
      if (w.type === 'field') tickField(w);
      w.timer = w.cooldown;
    }
    // Update orbital angles
    if (w.type === 'orbital') {
      w.angle += w.orbitSpeed;
    }
  }

  // ---- Spawning (difficulty-scaled) ----
  game.spawnTimer -= 1;
  if (game.spawnTimer <= 0) {
    const t = game.time;
    const interval = diffSpawnInterval(t);
    const batch = diffSpawnBatch(t);
    for (let i = 0; i < batch; i++) spawnMonster();
    game.spawnTimer = interval;
  }
  game.bossTimer += 1;
  const bossInterval = diffBossInterval(game.time) * 60;
  if (game.bossTimer > bossInterval) { spawnBoss(); game.bossTimer = 0; }

  // ---- Monsters ----
  let nearbyCount = 0;
  // Clear orbital hit tracking for new frame
  for (const m of game.monsters) m.hitByOrbit = new Set();

  for (let i = game.monsters.length - 1; i >= 0; i--) {
    const m = game.monsters[i];
    m.wobble += 0.1;
    if (m.spawnAnim > 0) m.spawnAnim -= 0.04;
    if (m.flash > 0) m.flash--;
    if (m.slowTimer > 0) m.slowTimer--;
    const slowMult = m.slowTimer > 0 ? 0.35 : 1;
    const ang = angleTo(m, p);
    const wobbleAng = ang + Math.sin(m.wobble) * 0.15;
    m.x += Math.cos(wobbleAng) * m.speed * slowMult;
    m.y += Math.sin(wobbleAng) * m.speed * slowMult;
    m.x = clamp(m.x, m.radius, CFG.MAP_W - m.radius);
    m.y = clamp(m.y, m.radius, CFG.MAP_H - m.radius);
    pushOutOfObstacles(m, m.radius);

    // Player collision (1 HP insta-death, but invulnerable during dash i-frames)
    const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy);
    if (d < m.radius + CFG.PLAYER_RADIUS - 2 && m.spawnAnim <= 0 && p.invulnFrames <= 0) { playerDeath(); return; }
    if (d < Math.max(W, H)) nearbyCount++;

    // Orbital weapon collision
    for (const w of p.weapons) {
      if (w.type !== 'orbital') continue;
      if (m.hitByOrbit.has(w.id)) continue;
      for (let j = 0; j < w.count; j++) {
        const orbAngle = w.angle + (j / w.count) * Math.PI * 2;
        const ox = p.x + Math.cos(orbAngle) * w.orbitRadius;
        const oy = p.y + Math.sin(orbAngle) * w.orbitRadius;
        const od = Math.hypot(ox - m.x, oy - m.y);
        if (od < m.radius + w.size) {
          if (damageMonster(m, { damage: w.damage, color: w.color, piercing: true, hitSet: new Set(), vfx: w.vfx })) {
            game.monsters.splice(i, 1);
          }
          m.hitByOrbit.add(w.id);
          break;
        }
      }
      if (i >= game.monsters.length) break;
    }
  }

  // ---- Projectiles ----
  for (let i = game.projectiles.length - 1; i >= 0; i--) {
    const pr = game.projectiles[i];
    pr.x += pr.vx; pr.y += pr.vy; pr.life--;
    if (game.frame % 2 === 0) { pr.trail.push({ x: pr.x, y: pr.y, life: 1 }); if (pr.trail.length > 6) pr.trail.shift(); }
    for (const t of pr.trail) t.life -= 0.15;
    pr.trail = pr.trail.filter(t => t.life > 0);
    if (pr.life <= 0 || pr.x < 0 || pr.x > CFG.MAP_W || pr.y < 0 || pr.y > CFG.MAP_H) { game.projectiles.splice(i, 1); continue; }
    let removed = false;
    for (let j = game.monsters.length - 1; j >= 0; j--) {
      const m = game.monsters[j];
      if (pr.hitSet.has(m)) continue;
      const dd = Math.hypot(pr.x - m.x, pr.y - m.y);
      if (dd < m.radius + pr.radius) {
        if (damageMonster(m, pr)) { game.monsters.splice(j, 1); }
        else { pr.hitSet.add(m); }
        if (!pr.piercing) { game.projectiles.splice(i, 1); removed = true; break; }
      }
    }
  }

  // ---- Particles ----
  updateParticles();

  // ---- Float Texts ----
  for (let i = game.floatTexts.length - 1; i >= 0; i--) {
    const ft = game.floatTexts[i];
    ft.y += ft.vy; ft.vy *= 0.95; ft.life -= 0.015;
    if (ft.life <= 0) game.floatTexts.splice(i, 1);
  }

  // ---- Effects ----
  game.shake *= 0.85;
  if (game.flashTimer > 0) game.flashTimer--;

  // ---- Combo Timer ----
  if (game.comboTimer > 0) {
    game.comboTimer--;
    if (game.comboTimer <= 0) game.combo = 0;
  }

  // ---- HUD ----
  updateHUD(nearbyCount);
}

function updateParticles() {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const pt = game.particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life -= pt.decay;
    if (pt.life <= 0) game.particles.splice(i, 1);
  }
  if (game.particles.length > CFG.MAX_PARTICLES) {
    game.particles.splice(0, game.particles.length - CFG.MAX_PARTICLES);
  }
}

function playerDeath() {
  game.state = 'dying'; game.shake = 25;
  const p = game.player;
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(2, 10);
    game.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.2, decay: 0.012, size: rand(3, 9), color: i % 3 === 0 ? '#ff4466' : (i % 3 === 1 ? '#ffaa00' : '#ffffff') });
  }
  playSound('death');
}

// ---- HUD ----
const hudLevel = document.getElementById('hudLevel');
const xpFill = document.getElementById('xpFill');
const hudKills = document.getElementById('hudKills');
const hudTime = document.getElementById('hudTime');
const hudMonsters = document.getElementById('hudMonsters');
const hudWeaponsEl = document.getElementById('hudWeapons');

function updateHUD(nearby) {
  const p = game.player;
  hudLevel.textContent = `Lv.${p.level}`;
  const need = xpNeeded(p.level);
  xpFill.style.width = (p.xp / need * 100) + '%';
  document.getElementById('hudXp').textContent = `${p.xp} / ${need}`;
  hudKills.textContent = `击杀 ${p.killCount}`;
  const min = Math.floor(game.time / 60), sec = Math.floor(game.time % 60);
  hudTime.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
  hudMonsters.textContent = `附近 ${nearby} 怪`;

  // Crown display — show once nearing 4 min or after earning
  const crownEl = document.getElementById('hudCrowns');
  if (game.time >= 180 || game.crowns > 0) {
    crownEl.style.display = '';
    crownEl.textContent = `👑 ${game.crowns}`;
  } else {
    crownEl.style.display = 'none';
  }

  // Dash status
  const dashEl = document.getElementById('hudDash');
  const dashBtn = document.getElementById('dashBtn');
  if (p.dashCooldown > 0) {
    dashEl.classList.add('cooling'); dashEl.classList.remove('ready');
    dashBtn.classList.add('cooling'); dashBtn.classList.remove('ready');
    // Cooldown ring: fill from 0 to 360 as cooldown progresses
    const cdPct = p.dashCooldown / 120; // fraction of cooldown remaining
    dashBtn.style.setProperty('--cd', (cdPct * 360) + 'deg');
  } else {
    dashEl.classList.remove('cooling'); dashEl.classList.add('ready');
    dashBtn.classList.remove('cooling'); dashBtn.classList.add('ready');
    dashBtn.style.setProperty('--cd', '0deg');
  }

  // Combo display
  const comboEl = document.getElementById('hudCombo');
  if (game.combo >= 3) {
    const mult = comboMultiplier(game.combo);
    comboEl.style.display = '';
    comboEl.textContent = `${game.combo} 连杀 ×${mult.toFixed(1)}`;
  } else {
    comboEl.style.display = 'none';
  }

  // Weapon badges
  let wpHtml = '';
  for (const w of p.weapons) {
    wpHtml += `<span class="hud-wp" style="background:${w.color}22;color:${w.color};border:1px solid ${w.color}44">${w.icon} ${w.name} Lv${w.level}</span>`;
  }
  hudWeaponsEl.innerHTML = wpHtml;
}

function showGameOver() {
  const p = game.player;
  const min = Math.floor(game.time / 60), sec = Math.floor(game.time % 60);
  document.getElementById('goTime').textContent = `${min}:${sec.toString().padStart(2, '0')}`;
  document.getElementById('goKills').textContent = p.killCount;
  document.getElementById('goLevel').textContent = p.level;
  document.getElementById('goCombo').textContent = game.comboMax;
  // Crowns
  if (game.crowns > 0) {
    document.getElementById('goCrownStat').style.display = '';
    document.getElementById('goCrowns').textContent = game.crowns;
  } else {
    document.getElementById('goCrownStat').style.display = 'none';
  }
  dashBtnEl.style.display = 'none';
  stopBgMusic();

  // Best records
  const best = loadBest();
  const timeSec = Math.floor(game.time);
  const newRec = [];
  if (timeSec > best.time) { best.time = timeSec; newRec.push('存活时间'); }
  if (p.killCount > best.kills) { best.kills = p.killCount; newRec.push('击杀数'); }
  if (p.level > best.level) { best.level = p.level; newRec.push('等级'); }
  if (game.comboMax > best.combo) { best.combo = game.comboMax; newRec.push('连杀'); }
  if (game.crowns > (best.crowns || 0)) { best.crowns = game.crowns; newRec.push('皇冠'); }
  saveBest(best);

  const recEl = document.getElementById('goNewRec');
  if (newRec.length > 0) {
    recEl.style.display = '';
    recEl.textContent = `★ 新纪录: ${newRec.join(' · ')} ★`;
  } else {
    recEl.style.display = 'none';
  }
  const bMin = Math.floor(best.time / 60), bSec = best.time % 60;
  document.getElementById('goBest').textContent = `最佳: ${bMin}:${bSec.toString().padStart(2,'0')} · ${best.kills}杀 · Lv.${best.level} · ${best.combo}连 · ${best.crowns||0}👑`;
  document.getElementById('gameover').classList.add('show');
}

// ---- Best Records (localStorage) ----
function loadBest() {
  try {
    const raw = localStorage.getItem('survivalHunter_best');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { time: 0, kills: 0, level: 1, combo: 0, crowns: 0 };
}
function saveBest(b) {
  try { localStorage.setItem('survivalHunter_best', JSON.stringify(b)); } catch (e) {}
}
function showMenuBest() {
  const best = loadBest();
  const el = document.getElementById('menuBest');
  if (best.time > 0 || best.kills > 0) {
    const min = Math.floor(best.time / 60), sec = best.time % 60;
    el.style.display = '';
    el.innerHTML = `🏆 最佳记录<br>${min}:${sec.toString().padStart(2,'0')} · ${best.kills}杀 · Lv.${best.level} · ${best.combo}连杀 · ${best.crowns||0}👑`;
  } else {
    el.style.display = 'none';
  }
}

// ---- Render ----
function render() {
  const sx = (Math.random() - 0.5) * game.shake, sy = (Math.random() - 0.5) * game.shake;
  ctx.save();
  ctx.translate(-game.camera.x + sx, -game.camera.y + sy);

  drawMap();

  // Map boundary — brick border
  ctx.strokeStyle = 'rgba(139, 69, 19, 0.3)'; ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, CFG.MAP_W, CFG.MAP_H);
  ctx.strokeStyle = 'rgba(139, 69, 19, 0.15)'; ctx.lineWidth = 2;
  ctx.strokeRect(-20, -20, CFG.MAP_W + 40, CFG.MAP_H + 40);

  // Particles
  for (const pt of game.particles) {
    ctx.globalAlpha = pt.life;
    if (pt.isZap) {
      ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      const segs = 3, dx = (pt.tx - pt.x) / segs, dy = (pt.ty - pt.y) / segs;
      for (let s = 1; s < segs; s++) {
        ctx.lineTo(pt.x + dx * s + (Math.random() - 0.5) * 8, pt.y + dy * s + (Math.random() - 0.5) * 8);
      }
      ctx.lineTo(pt.tx, pt.ty);
      ctx.stroke();
    } else if (pt.isFieldPulse) {
      const prog = 1 - pt.life / 0.5;
      ctx.strokeStyle = pt.color; ctx.lineWidth = 2 * (1 - prog);
      const r = pt.maxSize * (0.9 + prog * 0.1);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.stroke();
    } else if (pt.isPulse) {
      // Square expanding rings
      const progress = 1 - pt.life;
      const r = pt.maxSize * progress;
      const lw = (pt.lineWidth || 4) * (1 - progress);

      if (pt.isRipple) {
        ctx.strokeStyle = pt.color + '66'; ctx.lineWidth = lw;
        ctx.strokeRect(pt.x - r, pt.y - r, r * 2, r * 2);
      } else {
        ctx.strokeStyle = pt.color; ctx.lineWidth = lw;
        ctx.strokeRect(pt.x - r, pt.y - r, r * 2, r * 2);
      }
    } else {
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size * pt.life / 2, pt.y - pt.size * pt.life / 2, pt.size * pt.life, pt.size * pt.life);
    }
  }
  ctx.globalAlpha = 1;

  // Float texts
  for (const ft of game.floatTexts) {
    ctx.globalAlpha = ft.life; ctx.fillStyle = ft.color;
    ctx.font = `bold ${14 + (1 - ft.life) * 6}px sans-serif`; ctx.textAlign = 'center';
    ctx.shadowColor = ft.color; ctx.shadowBlur = 8;
    ctx.fillText(ft.text, ft.x, ft.y); ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  // Field weapons — draw UNDER monsters so sprites don't block visibility
  for (const w of game.player.weapons) {
    if (w.type !== 'field') continue;
    const vs = w.vStyle || 'magnet';
    const px = Math.floor(game.player.x), py = Math.floor(game.player.y);
    const fr = Math.floor(w.fieldRadius);
    const phase = game.frame * 0.05;

    // --- vStyle-based field drawing (sprite + fallback glow) ---
    const smap = WEAPON_SPRITE_MAP[vs];
    const sheet = smap ? SPRITE_SHEETS[smap.sheet] : null;
    const hasSprite = sheet && sheet.img;
    if (!hasSprite) {
      ctx.fillStyle = w.color + '22';
      ctx.beginPath(); ctx.arc(px, py, fr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = w.color + 'aa'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(px, py, fr, 0, Math.PI * 2); ctx.stroke();
    } else {
      // Semi-transparent so monsters underneath remain visible
      ctx.globalAlpha = 0.35;
      drawWeaponSprite(vs, px, py, fr * 2, fr * 2);
      ctx.globalAlpha = 1;
      // Subtle rim ring over the sprite
      ctx.strokeStyle = w.color + '66'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(px, py, fr, 0, Math.PI * 2); ctx.stroke();
    }

    // Universal perimeter sparks (for visual flair on all field weapons)
    for (let s = 0; s < (vs === 'starfield' ? 0 : vs === 'cosmic' ? 4 : 6); s++) {
      const angle = (s / 8) * Math.PI * 2 + phase;
      const sparkDist = fr + (Math.random() - 0.5) * 4;
      const cx = px + Math.cos(angle) * sparkDist;
      const cy = py + Math.sin(angle) * sparkDist;
      ctx.fillStyle = w.color;
      ctx.globalAlpha = 0.25 + Math.random() * 0.2;
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Monsters
  for (const m of game.monsters) drawMonster(m);

  // Orbital weapons
  for (const w of game.player.weapons) {
    if (w.type !== 'orbital') continue;
    const vs = w.vStyle || 'iron';
    for (let j = 0; j < w.count; j++) {
      const orbAngle = w.angle + (j / w.count) * Math.PI * 2;
      const ox = Math.floor(game.player.x + Math.cos(orbAngle) * w.orbitRadius);
      const oy = Math.floor(game.player.y + Math.sin(orbAngle) * w.orbitRadius);
      const sz = Math.floor(w.size);
      const orbGlow = Math.min(30, 10 + w.damage * 2);

      // Orbit trail - pixel dots
      for (let t = 0; t < 5; t++) {
        const ta = orbAngle - t * 0.08;
        const tx = game.player.x + Math.cos(ta) * w.orbitRadius;
        const ty = game.player.y + Math.sin(ta) * w.orbitRadius;
        ctx.fillStyle = w.color + '44';
        ctx.fillRect(Math.floor(tx) - 1, Math.floor(ty) - 1, 3, 3);
      }

      // Spark trail (damage-boosted orbitals)
      if (w.vfx.sparkTrail) {
        for (let s = 0; s < 3; s++) {
          const sa = orbAngle - 0.3 + s * 0.3;
          const sx = game.player.x + Math.cos(sa) * (w.orbitRadius - 4);
          const sy = game.player.y + Math.sin(sa) * (w.orbitRadius - 4);
          const sparkAlpha = 0.3 + Math.random() * 0.3;
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = sparkAlpha;
          ctx.beginPath(); ctx.arc(sx + (Math.random()-0.5)*4, sy + (Math.random()-0.5)*4, 1.5, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      // Energy ring for epic orbitals
      if (w.vfx.energyRing) {
        ctx.strokeStyle = w.color + '55'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(ox, oy, sz + 4, 0, Math.PI * 2); ctx.stroke();
      }

      // --- vStyle-based orb drawing (sprite + fallback) ---
      const spriteDrawn = drawWeaponSprite(vs, ox, oy, sz * 2, sz * 2, orbAngle);
      if (!spriteDrawn) {
        ctx.shadowColor = w.color; ctx.shadowBlur = orbGlow;
        ctx.fillStyle = w.color;
        ctx.beginPath(); ctx.arc(ox, oy, sz, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ox, oy, sz * 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  // Projectiles
  for (const pr of game.projectiles) {
    const hasVfx = pr.vfx || {};
    const vs = pr.vStyle || 'fire';
    // Trail
    for (const t of pr.trail) { ctx.globalAlpha = t.life * 0.35; ctx.fillStyle = pr.color; ctx.beginPath(); ctx.arc(t.x, t.y, pr.radius * t.life * 0.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;

    // Heat wave distortion ring (cooldown boost)
    if (hasVfx.heatWave) {
      ctx.strokeStyle = pr.color + '44'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.radius + 5, 0, Math.PI * 2); ctx.stroke();
    }

    // Energy ring (damage boost)
    if (hasVfx.energyRing) {
      const erLife = ((Date.now() / 200) % 1);
      ctx.strokeStyle = pr.color + '88'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.radius + erLife * 6, 0, Math.PI * 2); ctx.stroke();
    }

    const px = Math.floor(pr.x), py = Math.floor(pr.y);
    const r = Math.floor(pr.radius);
    const s = Math.floor(pr.radius * 1.6);

    // --- vStyle-based visual (sprite + fallback) ---
    const pAngle = Math.atan2(pr.vy, pr.vx);
    const spriteSize = Math.max(s, 16);
    const spriteDrawn = drawWeaponSprite(vs, px, py, spriteSize, spriteSize, pAngle);
    if (!spriteDrawn) {
      ctx.fillStyle = pr.color;
      ctx.fillRect(px - s/2, py - s/2, s, s);
      ctx.fillStyle = '#ffffff';
      const coreSize = Math.floor(r * 0.6);
      ctx.fillRect(px - coreSize/2, py - coreSize/2, coreSize, coreSize);
    }

    // Piercing glow — outer ring
    if (hasVfx.piercingGlow) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.strokeRect(px - s/2 - 2, py - s/2 - 2, s + 4, s + 4);
    }
  }

  // Player
  if (game.state !== 'dying' || game.deathAnim < 10) {
    // Dash afterimages
    for (const ai of game.player.afterimages) {
      ctx.globalAlpha = ai.life * 0.35;
      const ps = SPRITE_SHEETS.player;
      if (ps && ps.img) {
        const afr = Math.floor(game.frame / 6) % ps.cols;
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.translate(Math.floor(ai.x), Math.floor(ai.y));
        ctx.scale(game.player._facingRight !== false ? 1 : -1, 1);
        ctx.drawImage(ps.img, afr * ps.cellW, 0, ps.cellW, ps.cellH, -ps.cellW / 2, -ps.cellH / 2, ps.cellW, ps.cellH);
        ctx.restore();
      } else {
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(Math.floor(ai.x) - 11, Math.floor(ai.y) - 14, 22, 28);
      }
    }
    ctx.globalAlpha = 1;
    drawPlayer();
  }
  // Level up flash
  if (game.flashTimer > 0) {
    const p = game.player, r = (20 - game.flashTimer) * 12;
    ctx.strokeStyle = 'rgba(255, 215, 0, ' + (game.flashTimer / 20).toFixed(2) + ')'; ctx.lineWidth = 4;
    ctx.strokeRect(p.x - r, p.y - r, r * 2, r * 2);
  }

  ctx.restore();

  // Joystick
  if (joy.active) drawJoystick();

  // Danger vignette
  drawDangerVignette();

  // Minimap
  drawMinimap();
}

function drawMap() {
  const cam = game.camera;
  // Background image tiling
  if (bgImg && bgImg.ready) {
    const ts = bgImg.width;
    const gx0 = Math.floor(cam.x / ts) * ts, gy0 = Math.floor(cam.y / ts) * ts;
    for (let gy = gy0; gy < cam.y + H + ts; gy += ts)
      for (let gx = gx0; gx < cam.x + W + ts; gx += ts)
        if (gx >= -ts && gx < CFG.MAP_W + ts && gy >= -ts && gy < CFG.MAP_H + ts)
          ctx.drawImage(bgImg, gx, gy);
  } else {
    const ts = skyTex.width;
    const gx0 = Math.floor(cam.x / ts) * ts, gy0 = Math.floor(cam.y / ts) * ts;
    for (let gy = gy0; gy < cam.y + H + ts; gy += ts)
      for (let gx = gx0; gx < cam.x + W + ts; gx += ts)
        if (gx >= -ts && gx < CFG.MAP_W + ts && gy >= -ts && gy < CFG.MAP_H + ts)
          ctx.drawImage(skyTex, gx, gy);
  }

  // Obstacles — bricks & pipes
  for (const o of game.obstacles) {
    if (o.x + o.w < cam.x - 20 || o.x > cam.x + W + 20 ||
        o.y + o.h < cam.y - 20 || o.y > cam.y + H + 20) continue;
    if (o.type === 'brick') {
      // Brick block
      ctx.fillStyle = '#c84c09'; ctx.fillRect(o.x, o.y, o.w, o.h);
      // Brick pattern
      ctx.strokeStyle = '#6b3000'; ctx.lineWidth = 1;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
      const bw = o.w / 3;
      for (let r = 0; r < Math.floor(o.h / 8); r++) {
        const ry = o.y + r * 8;
        for (let c = 0; c < 3; c++) {
          const bx = o.x + c * bw + (r % 2) * (bw / 2);
          ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 0.5;
          ctx.strokeRect(bx, ry, bw, 7);
        }
      }
      // Top edge highlight
      ctx.fillStyle = '#e87830';
      ctx.fillRect(o.x + 1, o.y + 1, o.w - 2, 3);
    } else {
      // Pipe
      ctx.fillStyle = '#38a838'; ctx.fillRect(o.x, o.y, o.w, o.h);
      // Pipe rim
      ctx.fillStyle = '#50c850'; ctx.fillRect(o.x - 4, o.y, o.w + 8, 8);
      ctx.strokeStyle = '#207820'; ctx.lineWidth = 2;
      ctx.strokeRect(o.x - 4, o.y, o.w + 8, o.h);
      // Pipe shading
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(o.x + 3, o.y + 8, 8, o.h - 8);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(o.x + o.w - 10, o.y + 8, 7, o.h - 8);
    }
  }
  ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 8;
  ctx.strokeRect(0, 0, CFG.MAP_W, CFG.MAP_H);
  ctx.strokeStyle = '#a0522d'; ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, CFG.MAP_W - 8, CFG.MAP_H - 8);
}

function drawPlayer() {
  const p = game.player, r = CFG.PLAYER_RADIUS;
  const moveX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joy.dx;
  const moveY = (keys.s ? 1 : 0) - (keys.w ? 1 : 0) + joy.dy;
  const moving = Math.abs(moveX) > 0.1 || Math.abs(moveY) > 0.1;
  if (moveX > 0.1) p._facingRight = true;
  else if (moveX < -0.1) p._facingRight = false;
  const facingRight = p._facingRight !== false;
  const bob = moving ? Math.sin(game.frame * 0.15) * 2 : 0;
  const cpx = Math.floor(p.x), cpy = Math.floor(p.y + bob);

  const sheet = SPRITE_SHEETS.player;
  const cw = sheet ? sheet.cellW : 64;
  const ch = sheet ? sheet.cellH : 64;
  const totalFrames = sheet ? sheet.cols : 1;
  const animFrame = totalFrames > 1 ? (Math.floor(game.frame / 6) % totalFrames) : 0;
  const invert = game.player.invulnFrames > 0 && Math.floor(game.player.invulnFrames / 3) % 2 === 0;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(cpx - 12, cpy + 30, 24, 4);

  // Emperor player sprite (flipped by facing direction)
  if (sheet && sheet.img) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(cpx, cpy);
    ctx.scale(facingRight ? 1 : -1, 1);
    if (invert) ctx.filter = 'brightness(0) invert(1)';
    ctx.drawImage(sheet.img, animFrame * cw, 0, cw, ch, -cw / 2, -ch / 2, cw, ch);
    ctx.restore();
  } else {
    // Fallback circle while sprite loads
    ctx.fillStyle = invert ? '#ffffff' : '#e82000';
    ctx.beginPath(); ctx.arc(cpx, cpy, r, 0, Math.PI * 2); ctx.fill();
  }

  // Dash / invuln glow
  if (game.player.invulnFrames > 0 && !invert) {
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
    ctx.strokeRect(cpx - 34, cpy - 34, 68, 68);
  }
}

function drawMonster(m) {
  const scale = m.spawnAnim > 0 ? 1 - m.spawnAnim : 1, r = m.radius * scale;
  const sx = Math.floor(m.x), sy = Math.floor(m.y);
  const flash = m.flash > 0;
  const hitTint = flash;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(sx - r * 0.5, sy + r * 0.6, r, 4);

  // Elite aura
  if (m.isElite) {
    const pulse = 0.6 + Math.sin(game.frame * 0.1) * 0.2;
    ctx.strokeStyle = 'rgba(255, 215, 0, ' + pulse.toFixed(2) + ')'; ctx.lineWidth = 3;
    ctx.strokeRect(sx - r - 4, sy - r - 4, (r + 4) * 2, (r + 4) * 2);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(sx - 4, sy - r - 12, 8, 6);
    ctx.fillRect(sx - 6, sy - r - 10, 12, 2);
    for (let i = 0; i < 3; i++) ctx.fillRect(sx - 3 + i * 3, sy - r - 16, 2, 5);
  }

  const eyeAng = Math.atan2(game.player.y - sy, game.player.x - sx);
  const eDX = Math.round(Math.cos(eyeAng)), eDY = Math.round(Math.sin(eyeAng));

  switch (m.shape) {
    case 'blob': { // Goomba - brown mushroom
      ctx.fillStyle = hitTint ? '#ffffff' : '#b87830';
      ctx.fillRect(sx - r, sy - r * 0.3, r * 2, r * 1.1);
      ctx.fillStyle = hitTint ? '#ffffff' : '#8b5518';
      ctx.beginPath(); ctx.arc(sx, sy - r * 0.3, r * 0.85, Math.PI, 0); ctx.fill();
      ctx.fillStyle = hitTint ? '#ffffff' : '#6b3300';
      ctx.fillRect(sx - r + 2, sy + r * 0.6, r * 0.6, r * 0.3);
      ctx.fillRect(sx + r * 0.2, sy + r * 0.6, r * 0.6, r * 0.3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx - r * 0.5, sy - r * 0.3, 4, 5);
      ctx.fillRect(sx + r * 0.2, sy - r * 0.3, 4, 5);
      ctx.fillStyle = '#111';
      ctx.fillRect(sx - r * 0.3, sy - r * 0.1, 2, 3);
      ctx.fillRect(sx + r * 0.4, sy - r * 0.1, 2, 3);
      break;
    }
    case 'diamond': { // Red Koopa-like
      ctx.fillStyle = hitTint ? '#ffffff' : '#58b828';
      ctx.beginPath(); ctx.ellipse(sx, sy, r * 0.8, r * 0.55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hitTint ? '#ffffff' : '#3a9018';
      ctx.fillRect(sx - r * 0.4, sy - r * 0.25, r * 0.8, r * 0.5);
      ctx.fillStyle = hitTint ? '#ffffff' : '#f0d800';
      ctx.fillRect(sx + r * 0.3, sy - r * 0.5, r * 0.5, r * 0.5);
      ctx.fillRect(sx - r * 0.6, sy + r * 0.3, r * 0.4, r * 0.3);
      ctx.fillRect(sx + r * 0.2, sy + r * 0.3, r * 0.4, r * 0.3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + r * 0.5, sy - r * 0.4, 4, 4);
      ctx.fillRect(sx + r * 0.7, sy - r * 0.4, 4, 4);
      ctx.fillStyle = '#111';
      ctx.fillRect(sx + r * 0.6, sy - r * 0.3, 2, 2);
      break;
    }
    case 'square': { // Green Shy Guy
      ctx.fillStyle = hitTint ? '#ffffff' : '#58b828';
      ctx.fillRect(sx - r * 0.6, sy - r * 0.1, r * 1.2, r * 0.7);
      ctx.fillStyle = hitTint ? '#ffffff' : '#f0e8d0';
      ctx.beginPath(); ctx.arc(sx, sy - r * 0.25, r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillRect(sx - r * 0.25, sy - r * 0.35, 2, 2);
      ctx.fillRect(sx + r * 0.15, sy - r * 0.35, 2, 2);
      ctx.fillRect(sx - 2, sy - r * 0.1, 4, 1);
      ctx.fillStyle = hitTint ? '#ffffff' : '#6b3300';
      ctx.fillRect(sx - r * 0.45, sy + r * 0.4, r * 0.4, r * 0.25);
      ctx.fillRect(sx + r * 0.05, sy + r * 0.4, r * 0.4, r * 0.25);
      break;
    }
    case 'circle': { // Boo - white ghost
      ctx.fillStyle = hitTint ? '#ffffff' : 'rgba(240,240,255,0.8)';
      ctx.beginPath(); ctx.arc(sx, sy - r * 0.1, r * 0.7, Math.PI, 0);
      for (let i = 0; i <= 4; i++) {
        const wx = sx - r * 0.7 + (i / 4) * r * 1.4;
        const wy = sy + r * 0.5 + (i % 2 === 0 ? r * 0.2 : 0);
        if (i === 0) ctx.lineTo(wx, wy); else ctx.lineTo(wx, wy);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillRect(sx - r * 0.35, sy - r * 0.25, r * 0.3, r * 0.35);
      ctx.fillRect(sx + r * 0.05, sy - r * 0.25, r * 0.3, r * 0.35);
      ctx.fillRect(sx - r * 0.15, sy + r * 0.05, r * 0.3, r * 0.2);
      break;
    }
    case 'triangle': { // Bowser-like
      ctx.fillStyle = hitTint ? '#ffffff' : '#e89820';
      ctx.fillRect(sx - r * 0.7, sy - r * 0.2, r * 1.4, r * 0.8);
      ctx.fillStyle = hitTint ? '#ffffff' : '#58a828';
      ctx.beginPath(); ctx.ellipse(sx, sy, r * 0.65, r * 0.45, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = hitTint ? '#ffffff' : '#ffffff';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(sx - r * 0.4 + i * r * 0.4, sy - r * 0.8, r * 0.15, r * 0.35);
      }
      ctx.fillStyle = hitTint ? '#ffffff' : '#58a828';
      ctx.fillRect(sx - r * 0.35, sy - r * 0.7, r * 0.7, r * 0.4);
      ctx.fillStyle = hitTint ? '#ffffff' : '#e0e0e0';
      ctx.fillRect(sx - r * 0.4, sy - r * 1, 3, r * 0.3);
      ctx.fillRect(sx + r * 0.3, sy - r * 1, 3, r * 0.3);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(sx - r * 0.25, sy - r * 0.6, 4, 4);
      ctx.fillRect(sx + r * 0.1, sy - r * 0.6, 4, 4);
      ctx.fillStyle = hitTint ? '#ffffff' : '#e89820';
      ctx.fillRect(sx - r * 0.85, sy - r * 0.2, r * 0.3, r * 0.5);
      ctx.fillRect(sx + r * 0.55, sy - r * 0.2, r * 0.3, r * 0.5);
      break;
    }
    case 'star': { // King Boo
      ctx.fillStyle = hitTint ? '#ffffff' : '#ffd700';
      ctx.fillRect(sx - r * 0.35, sy - r * 1.1, r * 0.7, r * 0.2);
      for (let i = 0; i < 3; i++) ctx.fillRect(sx - r * 0.2 + i * r * 0.2, sy - r * 1.3, r * 0.1, r * 0.25);
      ctx.fillStyle = hitTint ? '#ffffff' : 'rgba(120, 80, 180, 0.85)';
      ctx.beginPath(); ctx.arc(sx, sy - r * 0.1, r * 0.75, Math.PI, 0);
      for (let i = 0; i <= 5; i++) {
        const wx = sx - r * 0.75 + (i / 5) * r * 1.5;
        const wy = sy + r * 0.5 + (i % 2 === 0 ? r * 0.25 : 0);
        if (i === 0) ctx.lineTo(wx, wy); else ctx.lineTo(wx, wy);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      ctx.fillRect(sx - r * 0.4, sy - r * 0.35, r * 0.3, r * 0.35);
      ctx.fillRect(sx + r * 0.1, sy - r * 0.35, r * 0.3, r * 0.35);
      ctx.fillStyle = '#111'; ctx.shadowBlur = 0;
      ctx.fillRect(sx - r * 0.25 + eDX, sy - r * 0.25 + eDY, 3, 3);
      ctx.fillRect(sx + r * 0.25 + eDX, sy - r * 0.25 + eDY, 3, 3);
      const barW = r * 1.6;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sx - barW / 2, sy - r - 16, barW, 5);
      ctx.fillStyle = '#ff00ff'; ctx.fillRect(sx - barW / 2, sy - r - 16, barW * (m.hp / m.maxHp), 5);
      break;
    }
  }
  // Health bar — show once monster takes damage
  if (m.hp < m.maxHp) {
    const barWx = Math.max(8, r * 1.5);
    const barHx = 3;
    const barY = m.isElite ? sy - r - 22 : sy - r - 10;
    const hpRatio = m.hp / m.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - barWx / 2, barY, barWx, barHx);
    const hpColor = hpRatio > 0.6 ? '#44ff44' : hpRatio > 0.3 ? '#ffaa00' : '#ff4444';
    ctx.fillStyle = hpColor;
    ctx.fillRect(sx - barWx / 2, barY, barWx * hpRatio, barHx);
  }
}
function drawJoystick() {
  const x = joy.cx, y = joy.cy;
  ctx.strokeStyle = 'rgba(139, 69, 19, 0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 60, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(139, 69, 19, 0.3)'; ctx.beginPath(); ctx.arc(x + joy.dx, y + joy.dy, 25, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(139, 69, 19, 0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + joy.dx, y + joy.dy, 25, 0, Math.PI * 2); ctx.stroke();
}

function drawDangerVignette() {
  if (game.state !== 'playing') return;
  let minDist = Infinity;
  for (const m of game.monsters) { const d = Math.hypot(m.x - game.player.x, m.y - game.player.y); if (d < minDist) minDist = d; }
  const dangerRange = 120;
  if (minDist < dangerRange) { const intensity = 1 - minDist / dangerRange; const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7); grad.addColorStop(0, 'rgba(255, 0, 0, 0)'); grad.addColorStop(1, `rgba(255, 0, 0, ${intensity * 0.3})`); ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H); }
}

function drawMinimap() {
  const mw = 120, mh = 120;
  miniCtx.clearRect(0, 0, mw, mh); miniCtx.fillStyle = 'rgba(92, 148, 252, 0.7)'; miniCtx.fillRect(0, 0, mw, mh);
  const scaleX = mw / CFG.MAP_W, scaleY = mh / CFG.MAP_H;
  miniCtx.strokeStyle = 'rgba(139, 69, 19, 0.5)'; miniCtx.lineWidth = 1; miniCtx.strokeRect(1, 1, mw - 2, mh - 2);
  for (const m of game.monsters) { const mx = m.x * scaleX, my = m.y * scaleY; miniCtx.fillStyle = m.isBoss ? '#8850b8' : (m.isElite ? '#ffd700' : m.color); const size = m.isBoss ? 3 : (m.isElite ? 2.5 : 1.5); miniCtx.fillRect(mx - size / 2, my - size / 2, size, size); }
  for (const o of game.obstacles) {
    const ox = o.x * scaleX, oy = o.y * scaleY, ow = Math.max(1, o.w * scaleX), oh = Math.max(1, o.h * scaleY);
    miniCtx.fillStyle = o.type === 'brick' ? 'rgba(200,100,30,0.6)' : 'rgba(56,168,56,0.6)';
    miniCtx.fillRect(ox, oy, ow, oh);
  }
  const px = game.player.x * scaleX, py = game.player.y * scaleY;
  miniCtx.fillStyle = '#e82000'; miniCtx.fillRect(px - 2, py - 2, 5, 5);
  miniCtx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; miniCtx.lineWidth = 1; miniCtx.beginPath(); miniCtx.arc(px, py, 8, 0, Math.PI * 2); miniCtx.stroke();
  const cx = game.camera.x * scaleX, cy = game.camera.y * scaleY, cw = W * scaleX, ch = H * scaleY;
  miniCtx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; miniCtx.lineWidth = 1; miniCtx.strokeRect(cx, cy, cw, ch);
}

// ---- Game Loop ----
function loop() { update(); render(); requestAnimationFrame(loop); }

function startGame() {
  initAudio();
  initGame();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('joyHint').style.display = 'none';
  dashBtnEl.style.display = '';
  hideUpgradeModal();
  startBgMusic();
}

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRetry').addEventListener('click', startGame);

// ---- Device detection & dash button setup ----
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const dashBtnEl = document.getElementById('dashBtn');
const hudDashHint = document.getElementById('hudDash');

// On touch devices: hide "SPACE" text hint, show big dash button
// On desktop: keep SPACE hint, also show dash button (clickable as alternative)
if (isTouchDevice) {
  hudDashHint.style.display = 'none';
} else {
  // Desktop: keep both, dash button also responds to click
  hudDashHint.style.display = '';
}

// Mouse click on dash button (desktop alternative)
dashBtnEl.addEventListener('click', () => {
  if (game && game.state === 'playing' && !game.upgradeActive) tryDash();
});
// Dash button touch handling (independent of canvas, supports multi-touch)
dashBtnEl.addEventListener('touchstart', e => {
  e.preventDefault();
  e.stopPropagation();
  if (game && game.state === 'playing' && !game.upgradeActive) {
    tryDash();
    dashBtnEl.classList.add('pressed');
  }
}, { passive: false });
dashBtnEl.addEventListener('touchend', e => {
  e.preventDefault();
  e.stopPropagation();
  dashBtnEl.classList.remove('pressed');
}, { passive: false });
dashBtnEl.addEventListener('touchcancel', () => {
  dashBtnEl.classList.remove('pressed');
}, { passive: false });

showMenuBest();
initGame(); game.state = 'menu'; loop();
</script>
