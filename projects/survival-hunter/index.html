<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秦始皇归来！</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#5c94fc;font-family:'Press Start 2P','Courier New','SimHei',monospace;touch-action:none;image-rendering:pixelated}
#game{display:block;position:absolute;top:0;left:0;image-rendering:pixelated}

#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.45)),url('assets/bg.png') center/cover no-repeat #3a2a1a;z-index:10;transition:opacity .4s}
#menu.hidden{opacity:0;pointer-events:none}
.menu-title{font-size:clamp(28px,6vw,48px);font-weight:700;color:#fff9c4;
  -webkit-text-stroke:4px #f9a825;text-stroke:4px #f9a825;
  paint-order:stroke fill;letter-spacing:0px;margin-bottom:8px;text-align:center}
.menu-sub{font-size:10px;color:#ffffff;-webkit-text-stroke:1px #333;text-stroke:1px #333;letter-spacing:2px;margin-bottom:48px;text-transform:uppercase;text-align:center}
.menu-info{font-size:15px;color:#ff2020;line-height:1.6;text-align:center;margin-bottom:40px;max-width:420px;
  background:rgba(30,0,0,.88);padding:24px 28px;border:3px solid #600000;border-radius:0;
  box-shadow:0 0 30px rgba(200,0,0,.3),inset 0 0 30px rgba(0,0,0,.4);
  animation:infoPulse 2s ease-in-out infinite;text-shadow:0 0 12px rgba(255,0,0,.6)}
@keyframes infoPulse{0%,100%{box-shadow:0 0 30px rgba(200,0,0,.3),inset 0 0 30px rgba(0,0,0,.4)}50%{box-shadow:0 0 50px rgba(255,0,0,.5),inset 0 0 50px rgba(0,0,0,.5)}}
.menu-info b{color:#ff4040;text-shadow:0 0 8px rgba(255,0,0,.8)}
.menu-info .danger{color:#ff3030;font-weight:700;text-shadow:0 0 10px rgba(255,0,0,.9)}
.btn-start{padding:14px 48px;font-size:16px;font-weight:400;color:#ffffff;
  background:#e82000;border:3px solid #600000;border-radius:0;cursor:pointer;
  font-family:'Press Start 2P',monospace;box-shadow:4px 4px 0 rgba(0,0,0,.3);
  transition:all .08s;letter-spacing:0px;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.btn-start:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.btn-start:hover{background:#ff4020}

#gameover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.8);z-index:10;opacity:0;pointer-events:none;transition:opacity .5s}
#gameover.show{opacity:1;pointer-events:auto}
.go-title{font-size:clamp(28px,6vw,44px);font-weight:400;color:#f83800;
  -webkit-text-stroke:2px #fff;text-stroke:2px #fff;paint-order:stroke fill;
  letter-spacing:4px;text-shadow:3px 3px 0 #8b0000;margin-bottom:8px;text-align:center}
.go-sub{font-size:9px;color:#ccc;letter-spacing:3px;margin-bottom:36px;text-align:center}
.go-stats{display:flex;gap:32px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.go-stat{text-align:center}
.go-stat-val{font-size:24px;font-weight:400;color:#ffd700;font-family:'Press Start 2P',monospace}
.go-stat-label{font-size:8px;color:#aaa;letter-spacing:1px;margin-top:6px;text-transform:uppercase}
.go-newrec{font-size:16px;font-weight:400;color:#ffd700;text-shadow:3px 3px 0 #8b6914;margin-bottom:16px;animation:recglow 1s ease infinite alternate}
@keyframes recglow{from{text-shadow:2px 2px 0 #8b6914}to{text-shadow:4px 4px 0 #b8860b}}
.go-best{font-size:9px;color:#bbb;margin-bottom:24px}
.menu-best{font-size:9px;color:#ffffff;margin-bottom:16px;padding:8px 16px;
  background:rgba(0,0,0,.3);border:2px solid #ffd700;box-shadow:0 0 0 rgba(0,0,0,0)}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:50px;left:0;right:0;padding:0 12px;display:flex;justify-content:space-between;align-items:flex-start}
.hud-left{display:flex;flex-direction:column;gap:5px}
.hud-level{font-size:12px;font-weight:400;color:#ffffff;-webkit-text-stroke:2px #333;text-stroke:2px #333;paint-order:stroke fill}
.hud-weapons{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.hud-wp{font-size:8px;padding:2px 6px;border:2px solid #333;font-weight:400;white-space:nowrap;background:rgba(255,255,255,.8);color:#333}
.xp-bar{width:200px;height:10px;background:rgba(0,0,0,.3);border:2px solid #333;overflow:hidden}
.xp-fill{height:100%;background:#f8b800;transition:width .15s}
.hud-xp{font-size:9px;color:#ffffff;-webkit-text-stroke:1px #333;text-stroke:1px #333;font-weight:400}
.hud-right{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.hud-time{font-size:16px;font-weight:400;color:#ffffff;-webkit-text-stroke:2px #333;text-stroke:2px #333;paint-order:stroke fill}
.hud-kills{font-size:9px;color:#ffffff;-webkit-text-stroke:1px #333;text-stroke:1px #333}
.hud-crowns{font-size:11px;color:#ffd700;-webkit-text-stroke:1px #8b6914;text-stroke:1px #8b6914;font-weight:400}
.go-stat-crown .go-stat-val{color:#ffd700;text-shadow:2px 2px 0 #8b6914;animation:combopulse .5s ease infinite alternate}
.hud-combo{font-size:12px;font-weight:400;color:#ffd700;-webkit-text-stroke:2px #8b6914;text-stroke:2px #8b6914;animation:combopulse .3s ease}
@keyframes combopulse{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.hud-dash{font-size:9px;color:#ffffff;margin-top:2px;-webkit-text-stroke:1px #333;text-stroke:1px #333}
.dash-key{display:inline-block;padding:1px 4px;border:2px solid #333;background:#f8b800;color:#333;font-weight:400;font-size:9px}
.hud-dash.cooling{opacity:.4}
.hud-dash.ready .dash-key{animation:dashready 1.5s ease infinite}
@keyframes dashready{0%,100%{box-shadow:0 0 0 rgba(248,184,0,0)}50%{box-shadow:0 0 8px rgba(248,184,0,.8)}}

/* ---- Mobile Dash Button ---- */
.dash-btn{
  position:absolute;right:24px;bottom:24px;width:64px;height:64px;
  background:#f8b800;border:4px solid #8b6914;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:6;user-select:none;-webkit-user-select:none;touch-action:none;
  transition:transform .08s,box-shadow .2s;
  color:#333;font-size:10px;font-weight:400;font-family:'Press Start 2P',monospace;
  box-shadow:4px 4px 0 rgba(0,0,0,.3);
}
.dash-btn .dash-icon{font-size:20px;line-height:1;margin-bottom:1px}
.dash-btn .dash-cd{
  position:absolute;inset:-4px;
  background:conic-gradient(rgba(0,0,0,.6) var(--cd,0deg),transparent 0deg);
  pointer-events:none;
}
.dash-btn.ready{box-shadow:4px 4px 0 rgba(0,0,0,.3),0 0 16px rgba(248,184,0,.6);animation:dashbtnpulse 1.5s ease infinite}
@keyframes dashbtnpulse{0%,100%{box-shadow:4px 4px 0 rgba(0,0,0,.3),0 0 8px rgba(248,184,0,.4)}50%{box-shadow:4px 4px 0 rgba(0,0,0,.3),0 0 20px rgba(248,184,0,.8)}}
.dash-btn.cooling{opacity:.5;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.dash-btn.cooling .dash-cd{display:block}
.dash-btn.ready .dash-cd{display:none}
.dash-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.dash-btn.pressed{transform:translate(2px,2px);background:#ffcc00;box-shadow:2px 2px 0 rgba(0,0,0,.2)}

.btn-pause{position:absolute;top:10px;left:12px;width:36px;height:36px;
  background:rgba(255,255,255,.7);border:3px solid #333;color:#333;
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:6;pointer-events:auto;transition:all .08s;font-family:'Press Start 2P',monospace}
.btn-pause:active{background:#fff;transform:scale(.9)}
.btn-music{position:absolute;top:10px;left:56px;width:36px;height:36px;
  background:rgba(255,255,255,.7);border:3px solid #333;color:#333;
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:6;pointer-events:auto;transition:all .08s;font-family:'Press Start 2P',monospace}
.btn-music:active{background:#fff;transform:scale(.9)}

#pauseOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:rgba(92,148,252,.95);z-index:3;opacity:0;pointer-events:none;transition:opacity .25s;overflow-y:auto;padding:48px 16px 32px}
#pauseOverlay.show{opacity:1;pointer-events:auto}
.pause-title{font-size:clamp(22px,5vw,36px);font-weight:400;color:#ffffff;
  -webkit-text-stroke:2px #333;text-stroke:2px #333;paint-order:stroke fill;letter-spacing:3px;margin-bottom:6px}
.pause-hint{font-size:9px;color:#ffffff;letter-spacing:1px;margin-bottom:24px}
.pause-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:700px;width:100%}
.pause-weapon-card{background:rgba(255,255,255,.85);border:3px solid #8b4513;
  padding:14px 16px;min-width:180px;max-width:220px;flex:1 1 180px;text-align:left;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.pw-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pw-icon{font-size:20px}
.pw-name{font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Press Start 2P',monospace}
.pw-lv{font-size:9px;font-weight:400;padding:1px 6px;border:2px solid #333;background:rgba(255,255,255,.5);margin-left:auto;flex-shrink:0}
.pw-row{display:flex;justify-content:space-between;font-size:9px;color:#555;margin-bottom:4px}
.pw-row span:last-child{color:#222;font-weight:400}
.pw-type-badge{display:inline-block;font-size:8px;padding:1px 6px;border:2px solid #333;margin-bottom:8px;font-weight:400;letter-spacing:1px;color:#333}
.pw-type-projectile{background:#ffcc44}
.pw-type-orbital{background:#ff8844}
.pw-type-pulse{background:#cc88ff}
.pw-abilities{font-size:8px;color:#555;margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.pw-abi{display:inline-block;padding:0 4px;border:1px solid #aaa;color:#666}

.pause-bottom-btns{display:flex;justify-content:center;gap:16px;margin-top:28px;width:100%;max-width:700px;flex-wrap:wrap}
.pause-btn{border:3px solid #6b3300;background:#f8b800;color:#6b3300;
  font-family:'Press Start 2P','Courier New','SimHei',monospace;font-size:10px;
  padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 #6b3300;
  letter-spacing:1px;text-transform:uppercase}
.pause-btn:active{background:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 #6b3300}

#minimap{position:absolute;bottom:12px;right:12px;width:120px;height:120px;
  border:3px solid #8b4513;background:rgba(92,148,252,.7);z-index:5;image-rendering:pixelated;box-shadow:3px 3px 0 rgba(0,0,0,.3)}

/* Upgrade Modal */
#upgradeModal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
#upgradeModal.show{opacity:1;pointer-events:auto}
.upgrade-title{font-size:20px;font-weight:400;color:#ffd700;
  -webkit-text-stroke:2px #8b6914;text-stroke:2px #8b6914;paint-order:stroke fill;
  letter-spacing:2px;margin-bottom:24px;text-shadow:3px 3px 0 #564208}
.upgrade-choices{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.upgrade-card{width:280px;max-width:45vw;padding:20px 16px;cursor:pointer;
  border:3px solid #333;transition:all .08s;position:relative;overflow:hidden;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.upgrade-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.upgrade-card:hover{border-color:#f8b800}
.upgrade-card .card-rarity{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.upgrade-card .card-icon{font-size:36px;margin-bottom:8px}
.upgrade-card .card-name{font-size:16px;font-weight:400;margin-bottom:6px;font-family:'Press Start 2P',monospace;color:#222}
.upgrade-card .card-desc{font-size:10px;color:#555;line-height:1.6}
.upgrade-card .card-stat{display:inline-block;padding:2px 6px;margin:2px;font-size:9px;font-weight:400;color:#fff;border:2px solid #333}
.upgrade-card.common{background:#e8e0d0}
.upgrade-card.common .card-rarity{color:#8b7355}
.upgrade-card.common .card-stat{background:#8b7355}
.upgrade-card.rare{background:#d4e8f0}
.upgrade-card.rare .card-rarity{color:#3060a0}
.upgrade-card.rare .card-stat{background:#3060a0}
.upgrade-card.epic{background:#e4d0f4}
.upgrade-card.epic .card-rarity{color:#7030a0}
.upgrade-card.epic .card-stat{background:#7030a0}
.upgrade-card.legendary{background:#ffe8b0}
.upgrade-card.legendary .card-rarity{color:#b8860b}
.upgrade-card.legendary .card-stat{background:#b8860b}

.toast{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%) scale(.8);
  font-size:18px;font-weight:400;color:#ffd700;
  -webkit-text-stroke:2px #8b6914;text-stroke:2px #8b6914;paint-order:stroke fill;
  opacity:0;pointer-events:none;z-index:15;transition:all .3s;text-align:center;white-space:nowrap;
  font-family:'Press Start 2P',monospace}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .toast-sub{font-size:10px;color:#ffffff;-webkit-text-stroke:1px #333;text-stroke:1px #333;font-weight:400;margin-top:4px;letter-spacing:1px}
.joy-hint{position:absolute;bottom:20px;left:20px;font-size:8px;color:#ffffff;-webkit-text-stroke:1px #333;text-stroke:1px #333;z-index:5;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-top">
    <div class="hud-left">
      <div class="hud-level" id="hudLevel">Lv.1</div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
      <div class="hud-xp" id="hudXp">0 / 30</div>
      <div class="hud-weapons" id="hudWeapons"></div>
    </div>
    <div class="hud-right">
      <div class="hud-time" id="hudTime">0:00</div>
      <div class="hud-kills" id="hudMonsters">附近 0 怪</div>
      <div class="hud-kills" id="hudKills">击杀 0</div>
      <div class="hud-crowns" id="hudCrowns" style="display:none">👑 0</div>
      <div class="hud-combo" id="hudCombo" style="display:none"></div>
      <div class="hud-dash" id="hudDash"><span class="dash-key">SPACE</span> 闪避</div>
    </div>
  </div>
  <div class="dash-btn ready" id="dashBtn" style="display:none">
    <div class="dash-cd"></div>
    <span class="dash-icon">⚡</span>
    闪避
  </div>
</div>
<canvas id="minimap" width="120" height="120"></canvas>
<div class="btn-pause" id="btnPause" onclick="togglePause()">⏸</div>
<div class="btn-music" id="btnMusic" onclick="toggleMusic()">🔇</div>
<div id="pauseOverlay" onclick="togglePause()">
  <div class="pause-title">暂停</div>
  <div class="pause-hint">点击任意位置继续 · 或按 P 键</div>
  <div class="pause-stats" id="pauseStats" onclick="event.stopPropagation()"></div>
  <div class="pause-bottom-btns" onclick="event.stopPropagation()">
    <button class="pause-btn" onclick="restartGame()">重新开始</button>
    <button class="pause-btn" onclick="backToMenu()">主界面</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="joy-hint" id="joyHint">触屏拖动移动 · WASD 键盘移动</div>

<div id="menu">
  <div class="menu-title">秦始皇归来！</div>
  <div class="menu-sub">SURVIVAL HUNTER</div>
  <div class="menu-info">
    <span class="danger">⚠ 你只有 1 点生命，被碰到一下就会死</span>
  </div>
  <div class="menu-best" id="menuBest" style="display:none"></div>
  <button class="btn-start" id="btnStart">开始狩猎</button>
</div>

<div id="gameover">
  <div class="go-title">你 死 了</div>
  <div class="go-sub">YOU DIED</div>
  <div class="go-newrec" id="goNewRec" style="display:none">★ 新纪录 ★</div>
  <div class="go-stats">
    <div class="go-stat"><div class="go-stat-val" id="goTime">0:00</div><div class="go-stat-label">存活时间</div></div>
    <div class="go-stat"><div class="go-stat-val" id="goKills">0</div><div class="go-stat-label">击杀数</div></div>
    <div class="go-stat"><div class="go-stat-val" id="goLevel">1</div><div class="go-stat-label">最终等级</div></div>
    <div class="go-stat"><div class="go-stat-val" id="goCombo">0</div><div class="go-stat-label">最高连杀</div></div>
    <div class="go-stat go-stat-crown" id="goCrownStat" style="display:none"><div class="go-stat-val" id="goCrowns">0</div><div class="go-stat-label">皇冠</div></div>
  </div>
  <div class="go-best" id="goBest"></div>
  <button class="btn-start" id="btnRetry">再来一局</button>
</div>

<div id="upgradeModal">
  <div class="upgrade-title">⚡ 选择强化</div>
  <div class="upgrade-choices" id="upgradeChoices"></div>
</div>

<script>
// ============================================================
//  秦始皇归来！ v2.0 Roguelike Weapon System
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- Map Textures (Mario pixel style) ----
let skyTex = null, groundTex = null;
function generateMapTextures() {
  const sc = document.createElement('canvas'); sc.width = 128; sc.height = 128;
  const st = sc.getContext('2d');
  st.fillStyle = '#5c94fc'; st.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 6; i++) {
    st.fillStyle = `rgba(255,255,255,${0.04 + Math.random() * 0.06})`;
    st.beginPath(); st.arc(Math.random() * 128, Math.random() * 128, 16 + Math.random() * 20, 0, Math.PI * 2); st.fill();
  }
  skyTex = sc;

  const gc = document.createElement('canvas'); gc.width = 128; gc.height = 64;
  const gt = gc.getContext('2d');
  gt.fillStyle = '#a04c10'; gt.fillRect(0, 0, 128, 64);
  gt.fillStyle = '#8b4513'; gt.fillRect(0, 0, 128, 8);
  for (let x = 0; x < 128; x += 4) {
    const gh = 2 + Math.sin(x * 0.3) * 2 + Math.cos(x * 0.7) * 1;
    gt.fillStyle = `rgb(${30 + Math.sin(x * 0.5) * 10},${120 + Math.sin(x * 0.4) * 15},${20 + Math.sin(x * 0.6) * 10})`;
    gt.fillRect(x, 8, 4, gh);
  }
  gt.fillStyle = '#6b8c20'; gt.fillRect(0, 8, 128, 6);
  for (let y = 14; y < 64; y += 4) {
    for (let x = 0; x < 128; x += 4) {
      gt.fillStyle = `rgba(0,0,0,${0.02 + Math.random() * 0.04})`;
      gt.fillRect(x, y, 4, 4);
    }
  }
  groundTex = gc;
}
generateMapTextures();

// ---- Background Image ----
const bgImg = new Image();
bgImg.onload = () => { bgImg.ready = true; };
bgImg.onerror = () => { console.warn('Failed to load background image'); };
bgImg.src = 'assets/bg.png';

// ---- Weapon Sprite Sheets ----
const SPRITE_SHEETS = {
  projectiles: { img: null, cellW: 112, cellH: 112, cols: 7, rows: 2, path: 'assets/projectiles.png' },
  orbitals:    { img: null, cellW: 112, cellH: 112, cols: 7, rows: 1, path: 'assets/orbitals.png' },
  fields:      { img: null, cellW: 112, cellH: 112, cols: 4, rows: 2, path: 'assets/fields.png' },
  player:      { img: null, cellW: 64,  cellH: 64,  cols: 4, rows: 1, path: 'assets/player.png' },
  meteor:      { img: null, cellW: 112, cellH: 112, cols: 4, rows: 1, path: 'assets/meteor.png' },
  magnet:      { img: null, cellW: 112, cellH: 112, cols: 4, rows: 1, path: 'assets/magnet.png' },

function loadSpriteSheets() {
  let remaining = Object.keys(SPRITE_SHEETS).length;
  for (const key of Object.keys(SPRITE_SHEETS)) {
    const sheet = SPRITE_SHEETS[key];
    const img = new Image();
    img.onload = () => {
      sheet.img = img;
      spritesLoaded++;
      if (--remaining === 0) spritesAllLoaded = true;
    };
    img.onerror = () => {
      console.warn('Failed to load sprite sheet:', sheet.path);
      if (--remaining === 0) spritesAllLoaded = true;
    };
    img.src = sheet.path;
  }
}
loadSpriteSheets();

function drawSpriteFromSheet(sheetKey, col, row, x, y, w, h, rotate) {
  const sheet = SPRITE_SHEETS[sheetKey];
  if (!sheet || !sheet.img) return false;
  const cw = sheet.cellW, ch = sheet.cellH;
  const sx = col * cw, sy = row * ch;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(x, y);
  if (rotate !== undefined) ctx.rotate(rotate);
  ctx.drawImage(sheet.img, sx, sy, cw, ch, -w / 2, -h / 2, w, h);
  ctx.restore();
  return true;
}

function drawWeaponSprite(vStyle, x, y, w, h, rotate) {
  const map = WEAPON_SPRITE_MAP[vStyle];
  if (!map) return false;
  const sheet = SPRITE_SHEETS[map.sheet];
  const totalFrames = sheet ? sheet.cols : 1;
  const frame = totalFrames > 1 ? (Math.floor(game.frame / 6) % totalFrames) : 0;
  return drawSpriteFromSheet(map.sheet, frame, map.row, x, y, w, h, rotate);
}

// ============================================================
//  DIFFICULTY CURVE — Three-phase design
//  Phase 1 (0-80s): high pressure, fast spawns, HP grows
//  Phase 2 (80-200s): breather, slow HP growth, weapons catch up
//  Phase 3 (200s+): escalating, faster & tankier monsters
// ============================================================
function diffSpawnInterval(t) {
  if (t < 20)  return Math.max(35, Math.floor(40 - t * 0.25));          // 40→35 (halved rate for first 20s)
  if (t < 80)  return Math.max(14, Math.floor(35 - (t-20) * 0.35));     // 35→14
  if (t < 200) return Math.max(10, Math.floor(14 - (t-80) * 0.033));    // 14→10
  return Math.max(4, Math.floor(10 - (t-200) * 0.045));                  // 10→4
}
function diffSpawnBatch(t) {
  if (t < 80)  return 1 + Math.floor(t / 44);                       // 1→2
  if (t < 200) return Math.min(4, 2 + Math.floor((t-80) / 48));     // 2→4
  return Math.min(6, 4 + Math.floor((t-200) / 50));                  // 4→6
}
function diffHpMult(t) {
  // 3 minutes: exponential apocalypse — ×10 every minute
  if (t >= 180) return Math.pow(10, 1 + Math.floor((t - 180) / 60));
  // Before 3 min: smooth growth
  if (t < 80)  return 1 + t * 0.012;                                // 1.0→1.96x
  if (t < 180) return 1.96 + (t-80) * 0.0045;                       // 1.96→2.41x at 180s
  return 1; // unreachable
}
function diffSpeedMult(t) {
  if (t < 180) return 1.0;
  // After 3 min: no multiplicative speed scaling (bonus handled separately)
  return 1.0;
}
function diffSpeedBonus(t) {
  if (t < 180) return 0;
  return 1;  // +1 flat speed to all monsters after 3 min
}
function diffEliteChance(t) {
  if (t < 30)  return 0;
  if (t < 200) return Math.min(0.07, 0.02 + (t-30) * 0.00033);     // 0→7%
  return Math.min(0.20, 0.07 + (t-200) * 0.0008);                   // 7→20%
}
function diffBossInterval(t) {
  if (t < 200) return 90;
  return Math.max(40, 90 - (t-200) * 0.35);                          // 90→40s
}

// ============================================================
//  MAP OBSTACLES — Brick blocks & pipes for terrain strategy
// ============================================================
const OBSTACLE_COUNT = 45;
function generateObstacles() {
  const obs = [];
  const centerX = CFG.MAP_W / 2, centerY = CFG.MAP_H / 2;
  const safeR = 200; // safe zone around spawn

  for (let i = 0; i < OBSTACLE_COUNT; i++) {
    let x, y, w, h, type;
    const isPipe = Math.random() < 0.28;
    if (isPipe) {
      w = 30 + Math.floor(Math.random() * 20); h = 40 + Math.floor(Math.random() * 30);
      type = 'pipe';
    } else {
      const cluster = Math.random() < 0.5 ? 2 : 1;
      w = 36 + Math.floor(Math.random() * 28);
      h = cluster > 1 ? (18 + Math.floor(Math.random() * 20)) : w;
      type = 'brick';
    }
    // Place randomly, avoid center safe zone
    let attempts = 0;
    do {
      x = rand(40, CFG.MAP_W - w - 40);
      y = rand(40, CFG.MAP_H - h - 40);
      attempts++;
    } while (attempts < 50 && Math.hypot(x + w/2 - centerX, y + h/2 - centerY) < safeR + 50);
    
    // Check overlap with existing obstacles (min 30px gap)
    const tooClose = obs.some(o =>
      Math.abs(x + w/2 - o.x - o.w/2) < (w + o.w)/2 + 30 &&
      Math.abs(y + h/2 - o.y - o.h/2) < (h + o.h)/2 + 30
    );
    if (!tooClose) obs.push({ x, y, w, h, type });
    else i--;
  }
  return obs;
}

function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
  const nearestX = Math.max(rx, Math.min(cx, rx + rw));
  const nearestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nearestX, dy = cy - nearestY;
  return dx * dx + dy * dy < cr * cr;
}

function pushOutOfObstacles(entity, radius) {
  for (const o of game.obstacles) {
    if (rectCircleCollision(o.x, o.y, o.w, o.h, entity.x, entity.y, radius)) {
      // Push entity to nearest edge
      const cx = entity.x, cy = entity.y;
      const toLeft = Math.abs(cx - o.x), toRight = Math.abs(cx - (o.x + o.w));
      const toTop = Math.abs(cy - o.y), toBottom = Math.abs(cy - (o.y + o.h));
      const minDist = Math.min(toLeft, toRight, toTop, toBottom);
      if (minDist === toLeft) entity.x = o.x - radius;
      else if (minDist === toRight) entity.x = o.x + o.w + radius;
      else if (minDist === toTop) entity.y = o.y - radius;
      else entity.y = o.y + o.h + radius;
      entity.x = clamp(entity.x, radius, CFG.MAP_W - radius);
      entity.y = clamp(entity.y, radius, CFG.MAP_H - radius);
    }
  }
}

function createWeapon(type) {
  const base = WEAPON_BASES[type];
  const traitMap = WEAPON_TRAITS[type];
  const nameKeys = Object.keys(traitMap);
  const name = nameKeys[Math.floor(Math.random() * nameKeys.length)];
  const t = traitMap[name];
  const color = base.colors[Math.floor(Math.random() * base.colors.length)];

  let damage = base.damage + (t.dmg || 0);
  if (damage < 1) damage = 1; // Minimum 1 damage

  let cooldown, speed, count, spread, piercing, bulletRadius, size;
  let orbitSpeed, orbitRadius, fieldRadius;

  if (type === 'projectile') {
    cooldown = Math.max(80, base.cooldown + (t.cd || 0));
    speed = Math.max(4, (base.speed || 10) + (t.spd || 0));
    count = 1 + (t.cnt || 0);
    spread = Math.max(0, (base.spread || 0.05) + (t.sprd || 0));
    piercing = t.prc || false;
    bulletRadius = Math.max(3, Math.min(20, (base.bulletRadius || 5) + (t.bRad || 0) + Math.floor(damage * 1.2)));
    orbitSpeed = base.orbitSpeed || 0.03;
    orbitRadius = base.orbitRadius || 55;
    size = (base.size || 8) + Math.floor(damage * 1.5);
    fieldRadius = base.fieldRadius || 120;
  } else if (type === 'orbital') {
    orbitSpeed = Math.max(0.005, (base.orbitSpeed || 0.025) * (t.spdMul || 1));
    orbitRadius = Math.max(20, Math.floor((base.orbitRadius || 90) * (t.radMul || 1)));
    size = Math.max(4, Math.min(28, (base.size || 10) + (t.size || 0) + Math.floor(damage * 1.5)));
    count = 1 + (t.cnt || 0);
    cooldown = base.cooldown || 300;
    speed = base.speed || 10;
    spread = base.spread || 0;
    piercing = base.piercing || false;
    bulletRadius = (base.bulletRadius || 5) + Math.floor(damage * 1.2);
    fieldRadius = base.fieldRadius || 120;
  } else if (type === 'field') {
    fieldRadius = Math.max(30, Math.floor((base.fieldRadius || 120) * (t.radMul || 1)));
    cooldown = Math.max(80, Math.floor((base.cooldown || 500) * (t.cdMul || 1)));
    count = base.count || 1;
    speed = base.speed || 10;
    spread = base.spread || 0;
    piercing = base.piercing || false;
    bulletRadius = (base.bulletRadius || 5) + Math.floor(damage * 1.2);
    orbitSpeed = base.orbitSpeed || 0.03;
    orbitRadius = base.orbitRadius || 55;
    size = (base.size || 8) + Math.floor(damage * 1.5);
  }

  const w = {
    id: ++weaponUid,
    type: base.type,
    name: name,
    vStyle: t.vStyle || 'fire', // visual style for unique appearance
    icon: base.icon,
    level: 1,
    damage, cooldown, timer: 0,
    color: color, baseColor: color,
    count, speed, spread, piercing, bulletRadius,
    orbitSpeed, orbitRadius, size,
    angle: Math.random() * Math.PI * 2,
    fieldRadius,
    vfx: {
      muzzleFlash: false, energyRing: false, piercingGlow: false,
      doubleRing: false, sparkTrail: false, ripple: false,
      heatWave: false, scatterBurst: false,
    },
  };
  return w;
}

// ---- Upgrade Choice Generator ----
function generateUpgradeChoices() {
  const p = game.player;
  const choices = [];

  const ALL_TYPES = ['projectile', 'orbital', 'field'];
  const ownedTypes = p.weapons.map(w => w.type);
  const newTypes = ALL_TYPES.filter(t => !ownedTypes.includes(t));
  const canAddNew = p.weapons.length < CFG.MAX_WEAPONS && newTypes.length > 0;

  function fingerprint(c) {
    if (c.kind === 'new') return 'new_' + c.type;
    return 'upgrade_' + p.weapons.indexOf(c.targetWeapon) + '_' + c.name;
  }

  function isDup(candidate) {
    const fp = fingerprint(candidate);
    return choices.some(existing => fingerprint(existing) === fp);
  }

  function makeOneChoice(retries) {
    if (retries === undefined) retries = 10;
    if (retries <= 0) return null;

    if (canAddNew && Math.random() < 0.45) {
      const type = newTypes[Math.floor(Math.random() * newTypes.length)];
      const wp = createWeapon(type);
      return {
        kind: 'new', name: wp.name, icon: wp.icon, type: type,
        typeLabel: WEAPON_BASES[type].name, desc: getTypeDescription(type),
        rarity: 'rare', weapon: wp,
      };
    } else if (p.weapons.length > 0) {
      const wp = p.weapons[Math.floor(Math.random() * p.weapons.length)];
      const upgrade = generateUpgrade(wp);
      if (upgrade) return upgrade;
      if (canAddNew) {
        const type = newTypes[Math.floor(Math.random() * newTypes.length)];
        const nw = createWeapon(type);
        return { kind: 'new', name: nw.name, icon: nw.icon, type: type,
          typeLabel: WEAPON_BASES[type].name, desc: getTypeDescription(type),
          rarity: 'rare', weapon: nw };
      }
    }
    return null;
  }

  for (let i = 0; i < 2; i++) {
    let attempt = 0;
    let candidate = null;
    do {
      candidate = makeOneChoice(10 - attempt);
      attempt++;
    } while (candidate && isDup(candidate) && attempt < 10);
    if (candidate) choices.push(candidate);
  }

  // Fallback to fill up to 2 choices
  while (choices.length < 2 && canAddNew) {
    const type = newTypes[Math.floor(Math.random() * newTypes.length)];
    const nw = createWeapon(type);
    const cand = { kind: 'new', name: nw.name, icon: nw.icon, type: type,
      typeLabel: WEAPON_BASES[type].name, desc: getTypeDescription(type),
      rarity: 'common', weapon: nw };
    if (!isDup(cand)) choices.push(cand); else break;
  }
  while (choices.length < 2 && p.weapons.length > 0) {
    const wp = p.weapons[Math.floor(Math.random() * p.weapons.length)];
    const upgrade = generateUpgrade(wp);
    if (!upgrade) break;
    if (!isDup(upgrade)) choices.push(upgrade); else {
      // try a different weapon
      let found = false;
      for (let tries = 0; tries < 10; tries++) {
        const wp2 = p.weapons[Math.floor(Math.random() * p.weapons.length)];
        const ug2 = generateUpgrade(wp2);
        if (ug2 && !isDup(ug2)) { choices.push(ug2); found = true; break; }
      }
      if (!found) break;
    }
  }

  return choices;
}

function generateUpgrade(wp) {
  const type = wp.type;
  const options = [];
  // Get themed names for this weapon
  const themes = (WEAPON_UPGRADE_THEMES[type] || {})[wp.name] || {};
  // Helper: get themed name, fall back to generic
  function tname(key, fallback) {
    const n = themes[key];
    if (n === '--') return null; // explicitly disabled for this weapon
    return n || fallback;
  }

  // Helper: brighten color on damage boost
  const brighten = (hex, amt) => {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  };

  // Common damage upgrade
  const commonDesc = type === 'projectile' ? '伤害 +1，子弹增大' : type === 'orbital' ? '伤害 +1，球体增大' : '伤害 +1，范围微增';
  const commonStat = type === 'projectile' ? '伤害+1 子弹+' : type === 'orbital' ? '伤害+1 球体+' : '伤害+1 范围+';
  const dn = tname('damage', '强化 ' + wp.name);
  if (dn) options.push({ name: dn, desc: commonDesc, stat: commonStat, rarity: 'common', effect: w => {
    w.damage += 1; w.level++;
    if (w.type === 'projectile') { w.bulletRadius = Math.min(18, w.bulletRadius + 1); w.vfx.muzzleFlash = true; w.vfx.energyRing = true; }
    if (w.type === 'orbital') { w.size = Math.min(22, w.size + 1); w.vfx.sparkTrail = true; }
    if (w.type === 'field') w.fieldRadius = Math.floor(w.fieldRadius * 1.05);
    w.color = brighten(w.color, 8);
  }, icon: '⬆' });

  if (type === 'projectile') {
    const mn = tname('multi', wp.name + '·连射');
    if (mn) options.push({ name: mn, desc: '弹幕数 +1', stat: '弹幕+1', rarity: 'common', effect: w => { w.count += 1; w.vfx.scatterBurst = true; w.level++; }, icon: '✦' });
    const sn = tname('speed', wp.name + '·疾风');
    if (sn) options.push({ name: sn, desc: '冷却 -15%', stat: '冷却-15%', rarity: 'common', effect: w => { w.cooldown = Math.max(60, Math.floor(w.cooldown * 0.85)); w.vfx.heatWave = true; w.level++; }, icon: '⚡' });
    if (!wp.piercing) {
      const pn = tname('pierce', wp.name + '·穿透');
      if (pn) options.push({ name: pn, desc: '子弹穿透敌人，子弹变亮', stat: '穿透', rarity: 'rare', effect: w => { w.piercing = true; w.vfx.piercingGlow = true; w.vfx.energyRing = true; w.color = brighten(w.color, 30); w.level++; }, icon: '➤' });
    }
    const scn = tname('scatter', wp.name + '·散射');
    if (scn) options.push({ name: scn, desc: '弹幕数 +2，散布增大', stat: '弹幕+2', rarity: 'rare', effect: w => { w.count += 2; w.spread += 0.06; w.vfx.scatterBurst = true; w.vfx.muzzleFlash = true; w.level++; }, icon: '✦✦' });
    const stn = tname('storm', wp.name + '·暴风');
    if (stn) options.push({ name: stn, desc: '伤害 +2，冷却 -20%，子弹增大', stat: '伤害+2 冷却-20%', rarity: 'epic', effect: w => {
      w.damage += 2; w.cooldown = Math.max(60, Math.floor(w.cooldown * 0.8));
      w.bulletRadius = Math.min(18, w.bulletRadius + 2);
      w.vfx.energyRing = true; w.vfx.muzzleFlash = true; w.vfx.heatWave = true;
      w.color = brighten(w.color, 20); w.level += 2;
    }, icon: '🔥' });
  } else if (type === 'orbital') {
    const tn = tname('twin', wp.name + '·双星');
    if (tn) options.push({ name: tn, desc: '环绕球 +1', stat: '球数+1', rarity: 'common', effect: w => { w.count += 1; w.level++; }, icon: '✦' });
    const rn = tname('range', wp.name + '·扩展');
    if (rn) options.push({ name: rn, desc: '轨道半径 +20%', stat: '半径+20%', rarity: 'common', effect: w => { w.orbitRadius = Math.floor(w.orbitRadius * 1.2); w.level++; }, icon: '◎' });
    const spn = tname('speed', wp.name + '·加速');
    if (spn) options.push({ name: spn, desc: '旋转速度 +25%', stat: '转速+25%', rarity: 'common', effect: w => { w.orbitSpeed *= 1.25; w.level++; }, icon: '⚡' });
    const gn = tname('gravity', wp.name + '·引力');
    if (gn) options.push({ name: gn, desc: '伤害 +2，半径 +10%，球体增大', stat: '伤害+2 半径+10%', rarity: 'rare', effect: w => {
      w.damage += 2; w.orbitRadius = Math.floor(w.orbitRadius * 1.1);
      w.size = Math.min(22, w.size + 1); w.vfx.sparkTrail = true; w.color = brighten(w.color, 15); w.level++;
    }, icon: '⬆' });
    const cln = tname('cluster', wp.name + '·星群');
    if (cln) options.push({ name: cln, desc: '环绕球 +2，伤害 +1', stat: '球数+2 伤害+1', rarity: 'epic', effect: w => {
      w.count += 2; w.damage += 1; w.size = Math.min(22, w.size + 1);
      w.vfx.sparkTrail = true; w.vfx.energyRing = true;
      w.color = brighten(w.color, 20); w.level += 2;
    }, icon: '🔥' });
  } else if (type === 'field') {
    const pwn = tname('power', wp.name + '·强化');
    if (pwn) options.push({ name: pwn, desc: '伤害 +2', stat: '伤害+2', rarity: 'common', effect: w => {
      w.damage += 2; w.color = brighten(w.color, 10); w.level++;
    }, icon: '⬆' });
    const exn = tname('expand', wp.name + '·扩展');
    if (exn) options.push({ name: exn, desc: '磁场范围 +20%', stat: '范围+20%', rarity: 'common', effect: w => { w.fieldRadius = Math.floor(w.fieldRadius * 1.2); w.level++; }, icon: '◎' });
    const pn = tname('pulse', wp.name + '·脉冲');
    if (pn) options.push({ name: pn, desc: '触发间隔 -30%', stat: '冷却-30%', rarity: 'common', effect: w => { w.cooldown = Math.max(150, Math.floor(w.cooldown * 0.7)); w.level++; }, icon: '⚡' });
    const stn = tname('storm', wp.name + '·风暴');
    if (stn) options.push({ name: stn, desc: '伤害 +3，范围 +10%', stat: '伤害+3 范围+10%', rarity: 'rare', effect: w => {
      w.damage += 3; w.fieldRadius = Math.floor(w.fieldRadius * 1.1);
      w.color = brighten(w.color, 20); w.level++;
    }, icon: '⬆' });
    const sin = tname('singularity', wp.name + '·奇点');
    if (sin) options.push({ name: sin, desc: '伤害 +5，冷却 -50%，范围 +15%', stat: '伤害+5 冷却-50%', rarity: 'epic', effect: w => {
      w.damage += 5; w.cooldown = Math.max(120, Math.floor(w.cooldown * 0.5));
      w.fieldRadius = Math.floor(w.fieldRadius * 1.15);
      w.color = brighten(w.color, 30); w.level += 2;
    }, icon: '🔥' });
  }

  if (options.length === 0) return null;

  // Pick random option, weighted by rarity
  const weights = { common: 50, rare: 30, epic: 15 };
  const pool = [];
  for (const opt of options) {
    const wgt = weights[opt.rarity] || 10;
    for (let i = 0; i < wgt; i++) pool.push(opt);
  }
  const chosen = pool[Math.floor(Math.random() * pool.length)];

  return {
    kind: 'upgrade',
    name: chosen.name,
    icon: chosen.icon,
    targetWeapon: wp,
    desc: chosen.desc,
    stat: chosen.stat,
    rarity: chosen.rarity,
    effect: chosen.effect,
  };
}

function getTypeDescription(type) {
  switch (type) {
    case 'projectile': return '自动向敌人发射弹幕';
    case 'orbital': return '环绕你旋转，碰撞造成伤害';
    case 'field': return '在身边生成固定磁场，每0.5秒造成范围伤害';
    default: return '';
  }
}

  const overlay = document.getElementById('pauseOverlay');
  const dashBtn = document.getElementById('dashBtn');

// ---- Dash ----
const DASH_SPEED = 14, DASH_FRAMES = 8, DASH_INVULN = 26, DASH_COOLDOWN = 120; // ~2s at 60fps

// ---- Combo ----
const COMBO_TIMEOUT = 180; // 3 seconds at 60fps
function comboMultiplier(combo) {
  if (combo >= 30) return 3.0;
  if (combo >= 15) return 2.0;
  if (combo >= 5) return 1.5;
  return 1.0;
}
function tryDash() {
  const p = game.player;
  if (p.dashCooldown > 0 || p.dashFrames > 0) return;
  // Get direction from current input
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (joy.active && (Math.abs(joy.dx) > 5 || Math.abs(joy.dy) > 5)) { dx = joy.dx; dy = joy.dy; }
  const len = Math.hypot(dx, dy);
  if (len < 0.1) { dx = p._facingRight !== false ? 1 : -1; dy = 0; } // dash in facing dir if no input
  else { dx /= len; dy /= len; }
  p.dashDirX = dx; p.dashDirY = dy;
  p.dashFrames = DASH_FRAMES;
  p.invulnFrames = DASH_INVULN;
  p.dashCooldown = DASH_COOLDOWN;
  // Dash burst particles
  for (let i = 0; i < 12; i++) {
    const a = Math.atan2(dy, dx) + Math.PI + (Math.random() - 0.5) * 1.2;
    const s = rand(2, 6);
    game.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, decay: 0.04, size: rand(2, 5), color: '#ffd700' });
  }
  playSound('dash');
}

      html += `<div class="pw-row"><span>伤害</span><span style="color:${w.color}">${w.damage}</span></div>`;
      html += `<div class="pw-row"><span>频率</span><span>每${(w.cooldown / 1000).toFixed(1)}s</span></div>`;
      html += `<div class="pw-row"><span>磁场范围</span><span>${w.fieldRadius}px</span></div>`;
    }

    if (abilities.length > 0) {
      html += `<div class="pw-abilities">${abilities.map(a => `<span class="pw-abi">${a}</span>`).join('')}</div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'p' && game && game.state === 'playing' && !game.upgradeActive) togglePause();

});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let joy = { active: false, cx: 0, cy: 0, dx: 0, dy: 0, id: null };
function getTouchPos(e, touch) { const rect = canvas.getBoundingClientRect(); return { x: touch.clientX - rect.left, y: touch.clientY - rect.top }; }

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (game.state !== 'playing') return;
  if (game.upgradeActive) { handleUpgradeTap(e); return; }
  // Use first available touch as joystick (dash button handles its own touches)
  if (joy.active) return;
  const touch = e.changedTouches[0], pos = getTouchPos(e, touch);
  joy.active = true; joy.id = touch.identifier; joy.cx = pos.x; joy.cy = pos.y; joy.dx = 0; joy.dy = 0;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (game.upgradeActive) return;
  if (!joy.active) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      const pos = getTouchPos(e, t), dx = pos.x - joy.cx, dy = pos.y - joy.cy, dist = Math.hypot(dx, dy), maxDist = 60;
      if (dist > maxDist) { joy.dx = (dx / dist) * maxDist; joy.dy = (dy / dist) * maxDist; }
      else { joy.dx = dx; joy.dy = dy; }
      break;
    }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) { joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; break; }
  }
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
}, { passive: false });

// ---- Utility ----
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
const angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

// ---- Spawning ----
function spawnMonster() {
  if (game.monsters.length >= CFG.MAX_MONSTERS) return;
  const t = game.time;
  const available = [];
  for (const [key, type] of Object.entries(MONSTER_TYPES)) {
    if (key === 'boss') continue;
    if (t >= type.unlock) available.push(key);
  }
  if (available.length === 0) available.push('slime');
  const typeName = available[Math.floor(Math.random() * available.length)];
  const type = MONSTER_TYPES[typeName];
  const angle = Math.random() * Math.PI * 2;
  const spawnDist = Math.max(W, H) / 2 + 60;
  const x = clamp(game.player.x + Math.cos(angle) * spawnDist, 30, CFG.MAP_W - 30);
  const y = clamp(game.player.y + Math.sin(angle) * spawnDist, 30, CFG.MAP_H - 30);

  // Elite chance — uses difficulty curve
  const eliteChance = diffEliteChance(t);
  const isElite = Math.random() < eliteChance && available.length > 1;

  const timeHpMult = diffHpMult(t);
  const hp = Math.floor((isElite ? type.hp * 3 + 2 : type.hp) * timeHpMult);
  const radius = isElite ? type.radius * 1.6 : type.radius;
  const xp = isElite ? 5 + Math.floor(Math.random() * 6) : type.xp;
  const speedMult = diffSpeedMult(t);
  const speedBonus = diffSpeedBonus(t);
  const speed = (isElite ? type.speed * 0.85 : type.speed * rand(0.85, 1.15)) * speedMult + speedBonus;

  game.monsters.push({
    type: typeName, x, y, hp, maxHp: hp,
    speed, radius,
    color: type.color, glow: isElite ? type.glow + 15 : type.glow, shape: type.shape, xp,
    flash: 0, spawnAnim: 1, wobble: Math.random() * Math.PI * 2,
    hitByOrbit: new Set(), slowTimer: 0,
    isElite,
  });

  if (isElite) {
    showFloatText(x, y - 30, '⚠ 精英怪!', '#ffd700', 1.5);
    playSound('elite');
  }
}

function spawnBoss() {
  const type = MONSTER_TYPES.boss;
  const angle = Math.random() * Math.PI * 2;
  const spawnDist = Math.max(W, H) / 2 + 80;
  game.monsters.push({
    type: 'boss',
    x: clamp(game.player.x + Math.cos(angle) * spawnDist, 50, CFG.MAP_W - 50),
    y: clamp(game.player.y + Math.sin(angle) * spawnDist, 50, CFG.MAP_H - 50),
    hp: Math.floor(type.hp * (1 + game.time * 0.02)), maxHp: Math.floor(type.hp * (1 + game.time * 0.02)), speed: type.speed, radius: type.radius,
    color: type.color, glow: type.glow, shape: type.shape, xp: type.xp,
    flash: 0, spawnAnim: 1, wobble: 0, isBoss: true, hitByOrbit: new Set(), slowTimer: 0,
  });
  showFloatText(game.player.x, game.player.y - 50, '⚠ BOSS 出现!', '#ff00ff', 1.5);
}

// ---- Combat ----
function fireProjectile(weapon) {
  const p = game.player;
  let nearest = null, minD = Infinity;
  for (const m of game.monsters) { const d = dist2(p, m); if (d < minD) { minD = d; nearest = m; } }
  if (!nearest) return;
  const baseAngle = angleTo(p, nearest);
  const count = weapon.count;
  const totalSpread = weapon.spread * (count - 1);

  // Muzzle flash particles
  if (weapon.vfx.muzzleFlash) {
    for (let i = 0; i < 6; i++) {
      const a = baseAngle + (Math.random() - 0.5) * 0.8;
      const s = 3 + Math.random() * 5;
      game.particles.push({
        x: p.x + Math.cos(baseAngle) * CFG.PLAYER_RADIUS,
        y: p.y + Math.sin(baseAngle) * CFG.PLAYER_RADIUS,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.3 + Math.random() * 0.2, decay: 0.04,
        size: 2 + Math.random() * 3, color: weapon.color,
      });
    }
  }

  // Scatter burst extra flash
  if (weapon.vfx.scatterBurst && count > 2) {
    for (let i = 0; i < 3; i++) {
      const a = baseAngle + (Math.random() - 0.5) * 0.5;
      game.particles.push({
        x: p.x + Math.cos(baseAngle) * CFG.PLAYER_RADIUS,
        y: p.y + Math.sin(baseAngle) * CFG.PLAYER_RADIUS,
        vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
        life: 0.25, decay: 0.05,
        size: 2, color: '#ffffff',
      });
    }
  }

  for (let i = 0; i < count; i++) {
    const offset = count === 1 ? 0 : (i / (count - 1) - 0.5) * totalSpread * 2;
    const ang = baseAngle + offset;
    game.projectiles.push({
      x: p.x + Math.cos(ang) * CFG.PLAYER_RADIUS,
      y: p.y + Math.sin(ang) * CFG.PLAYER_RADIUS,
      vx: Math.cos(ang) * weapon.speed,
      vy: Math.sin(ang) * weapon.speed,
      damage: weapon.damage, radius: weapon.bulletRadius,
      color: weapon.color, piercing: weapon.piercing,
      life: CFG.PROJECTILE_RANGE / weapon.speed,
      hitSet: new Set(), trail: [],
      weaponId: weapon.id,
      vfx: weapon.vfx, // carry visual effects
      vStyle: weapon.vStyle, // carry visual style
    });
  }
}

function tickField(weapon) {
  const p = game.player;
  let hitAny = false;
  for (let i = game.monsters.length - 1; i >= 0; i--) {
    const m = game.monsters[i];
    const d = Math.hypot(m.x - p.x, m.y - p.y);
    if (d < weapon.fieldRadius + m.radius) {
      if (damageMonster(m, { damage: weapon.damage, color: weapon.color, piercing: true, hitSet: new Set(), vfx: weapon.vfx })) {
        game.monsters.splice(i, 1);
      }
      // Zap line effect
      game.particles.push({
        x: p.x, y: p.y, vx: 0, vy: 0,
        life: 0.3, decay: 0.04, size: 0, color: weapon.color,
        isZap: true, tx: m.x, ty: m.y,
      });
      hitAny = true;
    }
  }
  // Pulsing ring on tick
  game.particles.push({
    x: p.x, y: p.y, vx: 0, vy: 0,
    life: 0.5, decay: 0.03, size: weapon.fieldRadius,
    color: weapon.color, isFieldPulse: true, maxSize: weapon.fieldRadius,
  });
  if (hitAny) playSound('shoot');
}

function damageMonster(m, proj) {
  m.hp -= proj.damage;
  m.flash = 8;
  const vfx = proj.vfx || {};
  const hitCount = vfx.energyRing ? 10 : 6;
  const hitSize = vfx.energyRing ? 4 : 3;
  for (let i = 0; i < hitCount; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(1, hitSize);
    const clr = i % 3 === 0 && vfx.energyRing ? (vfx.piercingGlow ? '#ffffff' : proj.color) : m.color;
    game.particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, decay: 0.03, size: rand(2, 5), color: clr });
  }
  // Energy burst on piercing hit
  if (vfx.piercingGlow) {
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      game.particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, life: 0.4, decay: 0.05, size: 2, color: '#ffffff' });
    }
  }
  if (m.hp <= 0) {
    const count = m.isBoss ? 60 : (m.isElite ? 35 : 15);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(2, m.isBoss ? 9 : 5);
      const clr = m.isElite ? (i % 2 ? '#ffd700' : '#fff8aa') : (i % 2 ? m.color : '#ffffff');
      game.particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.018, size: rand(3, m.isBoss ? 10 : 6), color: clr });
    }
    game.player.killCount++;
    // Combo system
    game.combo++;
    game.comboTimer = COMBO_TIMEOUT;
    if (game.combo > game.comboMax) game.comboMax = game.combo;
    const mult = comboMultiplier(game.combo);
    const xpGain = Math.round(m.xp * mult);
    gainXP(m.xp);
    showFloatText(m.x, m.y, '+' + xpGain + ' XP', mult > 1 ? '#ffaa00' : '#00ff88', 0.8);
    // Combo milestone notification
    if (game.combo === 5 || game.combo === 15 || game.combo === 30) {
      showFloatText(m.x, m.y - 25, `${game.combo}连杀! ×${mult.toFixed(1)}`, '#ffaa00', 1.2);
    }
    if (m.isBoss) { game.shake = 12; showFloatText(m.x, m.y - 30, 'BOSS 击杀!', '#ff00ff', 1.2); }
    playSound(m.isBoss ? 'bosskill' : 'kill');
    return true;
  }
  return false;
}

function gainXP(amount) {
  const p = game.player;
  if (game.upgradeActive) return; // Don't process XP during upgrade selection
  const mult = comboMultiplier(game.combo);
  const final = Math.round(amount * mult);
  p.xp += final;
  while (p.xp >= xpNeeded(p.level)) {
    p.xp -= xpNeeded(p.level);
    p.level++;
    onLevelUp();
  }
}

function onLevelUp() {
  const p = game.player;
  // Golden burst
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(2, 7);
    game.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.015, size: rand(3, 7), color: i % 2 ? '#ffd700' : '#fff8aa' });
  }
  game.flashTimer = 20;
  game.shake = 6;
  playSound('levelup');

  // Generate and show upgrade choices
  game.upgradeChoices = generateUpgradeChoices();
  game.upgradeActive = true;
  showUpgradeModal(game.upgradeChoices);
}

function applyUpgrade(choice) {
  if (choice.kind === 'new') {
    game.player.weapons.push(choice.weapon);
    showToast(choice.name, '获得新武器: ' + WEAPON_BASES[choice.type].name + '类');

    choice.effect(choice.targetWeapon);
    choice.targetWeapon.level++;
    showToast(choice.name, choice.stat);
  }
  game.upgradeActive = false;
  hideUpgradeModal();
  playSound('levelup');
}
