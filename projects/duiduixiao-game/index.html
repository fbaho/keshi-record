<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>躲避大师 - 抖音小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        
        #gameOverScreen {
            display: none;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h2 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #ffd700;
        }
        
        .btn {
            padding: 15px 50px;
            font-size: 1.5em;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        #score {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
        }
        
        #finalScore {
            font-size: 3em;
            color: #ffd700;
            margin: 20px 0;
        }
        
        .instructions {
            text-align: center;
            margin: 20px;
            font-size: 1.2em;
            line-height: 1.6;
            color: #ddd;
        }
        
        .emoji {
            font-size: 4em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="score">0</div>
        
        <div id="startScreen">
            <div class="emoji">🎮</div>
            <h1>躲避大师</h1>
            <div class="instructions">
                左右滑动控制角色<br>
                躲避掉落的障碍物<br>
                坚持越久分数越高！
            </div>
            <button class="btn" onclick="game.start()">开始游戏</button>
        </div>
        
        <div id="gameOverScreen">
            <h2>游戏结束</h2>
            <div id="finalScore">0</div>
            <div class="instructions">你成功躲避了 <span id="obstaclesCount">0</span> 个障碍物</div>
            <button class="btn" onclick="game.restart()">再来一局</button>
        </div>
    </div>

    <script>
        const game = {
            canvas: null,
            ctx: null,
            player: {
                x: 0,
                y: 0,
                width: 60,
                height: 60,
                speed: 8,
                color: '#ff6b6b'
            },
            obstacles: [],
            score: 0,
            gameRunning: false,
            animationId: null,
            touchStartX: 0,
            obstacleSpeed: 3,
            obstacleSpawnRate: 60,
            frameCount: 0,
            backgroundColor: '#2a5298',
            
            init() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // 触摸事件
                this.canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                
                // 鼠标事件（用于测试）
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                
                // 键盘事件
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            },
            
            resize() {
                const container = document.getElementById('gameContainer');
                this.canvas.width = container.clientWidth;
                this.canvas.height = container.clientHeight;
                this.player.x = this.canvas.width / 2 - this.player.width / 2;
                this.player.y = this.canvas.height - this.player.height - 30;
            },
            
            handleTouchStart(e) {
                e.preventDefault();
                this.touchStartX = e.touches[0].clientX;
            },
            
            handleTouchMove(e) {
                if (!this.gameRunning) return;
                e.preventDefault();
                const touchX = e.touches[0].clientX;
                const deltaX = touchX - this.touchStartX;
                this.player.x += deltaX * 0.8;
                this.touchStartX = touchX;
                
                // 边界检查
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x > this.canvas.width - this.player.width) {
                    this.player.x = this.canvas.width - this.player.width;
                }
            },
            
            handleMouseDown(e) {
                this.touchStartX = e.clientX;
            },
            
            handleMouseMove(e) {
                if (!this.gameRunning) return;
                const rect = this.canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                this.player.x = mouseX - this.player.width / 2;
                
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x > this.canvas.width - this.player.width) {
                    this.player.x = this.canvas.width - this.player.width;
                }
            },
            
            handleKeyDown(e) {
                if (!this.gameRunning) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    this.player.x -= this.player.speed * 2;
                }
                if (e.key === 'ArrowRight' || e.key === 'd') {
                    this.player.x += this.player.speed * 2;
                }
                
                if (this.player.x < 0) this.player.x = 0;
                if (this.player.x > this.canvas.width - this.player.width) {
                    this.player.x = this.canvas.width - this.player.width;
                }
            },
            
            start() {
                document.getElementById('startScreen').style.display = 'none';
                this.gameRunning = true;
                this.score = 0;
                this.obstacles = [];
                this.frameCount = 0;
                this.obstacleSpeed = 3;
                this.obstacleSpawnRate = 60;
                this.updateScore();
                this.gameLoop();
            },
            
            restart() {
                document.getElementById('gameOverScreen').style.display = 'none';
                this.start();
            },
            
            gameLoop() {
                if (!this.gameRunning) return;
                
                this.ctx.fillStyle = this.backgroundColor;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制背景星星
                this.drawStars();
                
                // 更新和绘制玩家
                this.drawPlayer();
                
                // 生成障碍物
                this.frameCount++;
                if (this.frameCount % this.obstacleSpawnRate === 0) {
                    this.spawnObstacle();
                }
                
                // 更新和绘制障碍物
                this.updateObstacles();
                
                // 增加难度
                if (this.score > 0 && this.score % 10 === 0) {
                    this.obstacleSpeed = 3 + Math.floor(this.score / 10) * 0.5;
                    this.obstacleSpawnRate = Math.max(30, 60 - Math.floor(this.score / 10) * 3);
                }
                
                this.animationId = requestAnimationFrame(() => this.gameLoop());
            },
            
            drawStars() {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 137.508) % this.canvas.width;
                    const y = (i * 73 + this.frameCount * 0.5) % this.canvas.height;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 2, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            },
            
            drawPlayer() {
                // 绘制玩家（一个可爱的小球）
                const gradient = this.ctx.createRadialGradient(
                    this.player.x + this.player.width / 2,
                    this.player.y + this.player.height / 2,
                    0,
                    this.player.x + this.player.width / 2,
                    this.player.y + this.player.height / 2,
                    this.player.width / 2
                );
                gradient.addColorStop(0, '#ff6b6b');
                gradient.addColorStop(1, '#ee5a52');
                
                this.ctx.fillStyle = gradient;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.player.x + this.player.width / 2,
                    this.player.y + this.player.height / 2,
                    this.player.width / 2,
                    0,
                    Math.PI * 2
                );
                this.ctx.fill();
                
                // 绘制眼睛
                this.ctx.fillStyle = 'white';
                this.ctx.beginPath();
                this.ctx.arc(this.player.x + this.player.width / 2 - 10, this.player.y + 20, 6, 0, Math.PI * 2);
                this.ctx.arc(this.player.x + this.player.width / 2 + 10, this.player.y + 20, 6, 0, Math.PI * 2);
                this.ctx.fill();
                
                this.ctx.fillStyle = 'black';
                this.ctx.beginPath();
                this.ctx.arc(this.player.x + this.player.width / 2 - 10, this.player.y + 20, 3, 0, Math.PI * 2);
                this.ctx.arc(this.player.x + this.player.width / 2 + 10, this.player.y + 20, 3, 0, Math.PI * 2);
                this.ctx.fill();
            },
            
            spawnObstacle() {
                const width = 40 + Math.random() * 60;
                const x = Math.random() * (this.canvas.width - width);
                const colors = ['#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                this.obstacles.push({
                    x: x,
                    y: -50,
                    width: width,
                    height: 50,
                    speed: this.obstacleSpeed + Math.random() * 2,
                    color: color
                });
            },
            
            updateObstacles() {
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obs = this.obstacles[i];
                    obs.y += obs.speed;
                    
                    // 绘制障碍物
                    this.ctx.fillStyle = obs.color;
                    this.ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    
                    // 绘制障碍物边框
                    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                    this.ctx.lineWidth = 3;
                    this.ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    
                    // 碰撞检测
                    if (this.checkCollision(obs)) {
                        this.gameOver();
                        return;
                    }
                    
                    // 移除屏幕外的障碍物并加分
                    if (obs.y > this.canvas.height) {
                        this.obstacles.splice(i, 1);
                        this.score++;
                        this.updateScore();
                    }
                }
            },
            
            checkCollision(obs) {
                return (
                    this.player.x < obs.x + obs.width &&
                    this.player.x + this.player.width > obs.x &&
                    this.player.y < obs.y + obs.height &&
                    this.player.y + this.player.height > obs.y
                );
            },
            
            updateScore() {
                document.getElementById('score').textContent = this.score;
            },
            
            gameOver() {
                this.gameRunning = false;
                cancelAnimationFrame(this.animationId);
                
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('obstaclesCount').textContent = this.score;
                document.getElementById('gameOverScreen').style.display = 'flex';
            }
        };
        
        // 初始化游戏
        window.onload = () => {
            game.init();
        };
    </script>
</body>
</html>
